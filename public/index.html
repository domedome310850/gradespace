<style>:root {
  color-scheme: light;
  --bg: #F7F7FB; --surface: #FFFFFF; --surface-2: #F2F1FA; --surface-3: #E9E7F7;
  --line: #E5E3F0; --line-strong: #D2CFE5;
  --ink: #1D1B36; --ink-2: #47456A; --muted: #75739A;
  --accent: #4F46E5; --accent-hover: #4338CA; --accent-ink: #FFFFFF; --accent-soft: #ECEBFF; --accent-text: #4338CA;
  --lav: #A5A0F5; --sky: #4C9BEA; --sky-soft: #E2EFFD;
  --earned: #4F46E5; --lost: #DCD9EE; --pending-a: #CFE3FB; --pending-b: #E6F0FD;
  --ok: #157A52; --ok-soft: #E2F4EB; --warn: #9A5B00; --warn-soft: #FFF2DA; --bad: #BF3434; --bad-soft: #FCE7E7;
  --shadow: 0 1px 2px rgba(29,27,54,.05), 0 6px 18px -8px rgba(29,27,54,.10);
  --shadow-lg: 0 20px 60px -20px rgba(29,27,54,.35);
  --r-xl: 20px; --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --c-indigo: #5B55E8; --c-blue: #3B8BEB; --c-teal: #14A39A; --c-green: #3E9B4F; --c-amber: #D99118; --c-rose: #E0567A; --c-violet: #9558E0; --c-slate: #6B7393;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1115; --surface: #171A20; --surface-2: #1E2229; --surface-3: #282D36;
    --line: #2A2F38; --line-strong: #3A404B;
    --ink: #E8EBF0; --ink-2: #C3C8D1; --muted: #8D95A3;
    --accent: #78A9F5; --accent-hover: #93BBF8; --accent-ink: #0C1424; --accent-soft: #1A2638; --accent-text: #9CC2FA;
    --lav: #5D7EAE; --sky: #6CC6D4; --sky-soft: #142D33;
    --earned: #78A9F5; --lost: #343A45; --pending-a: #233449; --pending-b: #1A2636;
    --ok: #5CC795; --ok-soft: #142A20; --warn: #E5B055; --warn-soft: #2D2413; --bad: #EF8080; --bad-soft: #331B1D;
    --c-indigo: #7E8CF0; --c-blue: #5E9EF0; --c-teal: #3EBFB2; --c-green: #63B86F; --c-amber: #E0A43A; --c-rose: #E87595; --c-violet: #A983E8; --c-slate: #8B95AE;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 24px 70px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1115; --surface: #171A20; --surface-2: #1E2229; --surface-3: #282D36;
  --line: #2A2F38; --line-strong: #3A404B;
  --ink: #E8EBF0; --ink-2: #C3C8D1; --muted: #8D95A3;
  --accent: #78A9F5; --accent-hover: #93BBF8; --accent-ink: #0C1424; --accent-soft: #1A2638; --accent-text: #9CC2FA;
  --lav: #5D7EAE; --sky: #6CC6D4; --sky-soft: #142D33;
  --earned: #78A9F5; --lost: #343A45; --pending-a: #233449; --pending-b: #1A2636;
  --ok: #5CC795; --ok-soft: #142A20; --warn: #E5B055; --warn-soft: #2D2413; --bad: #EF8080; --bad-soft: #331B1D;
  --c-indigo: #7E8CF0; --c-blue: #5E9EF0; --c-teal: #3EBFB2; --c-green: #63B86F; --c-amber: #E0A43A; --c-rose: #E87595; --c-violet: #A983E8; --c-slate: #8B95AE;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 24px 70px -20px rgba(0,0,0,.75);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-wrap: break-word; line-break: auto;
}
html[lang="th"] body { line-height: 1.7; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
/* Help & Q&A: compact, responsive and consistent with existing cards. */
.help-h2{font-size:18px;margin:0 0 12px}.help-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.help-step{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-width:0}
.help-step span{flex:0 0 29px;width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);font-weight:750}
.help-step p{margin:0;font-size:13px;min-width:0}.help-faq{display:grid;gap:8px}.help-accordion{border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.help-accordion summary{font-weight:650;cursor:pointer}.help-accordion p{font-size:13px;color:var(--muted);margin:9px 0 0}
.help-question-list{display:grid;gap:10px;margin-top:17px}.help-question{border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;gap:7px;overflow-wrap:anywhere}
.help-answer{padding:11px;background:var(--accent-soft);border-radius:9px}.help-answer p{white-space:pre-wrap;margin:5px 0 0;font-size:13px}
@media(max-width:650px){.help-steps{grid-template-columns:1fr}}

/* Keep topbar controls anchored when save/status translations change width. */
.topbar .save-state { width:150px; min-width:150px; justify-content:flex-end; overflow:hidden; }
.topbar .seg { flex:0 0 115px; width:115px; justify-content:center; }
.topbar .seg button { flex:1; min-width:0; }
.topbar > .btn.icon, .topbar > a.btn.icon { flex:0 0 38px; width:38px; }
@media(max-width:900px){.topbar .save-state{width:18px;min-width:18px;justify-content:center}.topbar .seg{width:100px;flex-basis:100px}}

.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line);
  background: var(--surface); display: flex; flex-direction: column; gap: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 39px; height: 39px; border-radius: 13px; display: grid; place-items: center; flex: none; box-shadow: 0 4px 11px rgba(79,70,229,.19); overflow: hidden; }
.brand-mark svg { width: 100%; height: 100%; display: block; }
.brand-name { font-weight: 700; font-size: 19px; letter-spacing: -.045em; line-height: 1.12; white-space: nowrap; }
.brand-name-accent { color: var(--accent-text); }
.brand:hover .brand-mark { box-shadow: 0 6px 14px rgba(79,70,229,.24); }
.auth-card .brand-mark { width: 44px; height: 44px; border-radius: 15px; }
.auth-card .brand-name { font-size: 22px; }
.brand-tag { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2);
  text-decoration: none; font-weight: 500; font-size: 14.5px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item svg { flex: none; }
.side-foot { margin-top: auto; padding: 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.topbar .brand { display: none; padding: 0; }
.topbar-spacer { flex: 1; }
.save-state { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save-dot.busy { background: var(--warn); }
.page { padding: 8px 28px 48px; max-width: 1160px; width: 100%; margin: 0 auto; }
.bottomnav { display: none; }
@media(max-width:900px){.bottomnav{grid-template-columns: repeat(8,minmax(0,1fr)) !important;}}

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { padding: 10px 16px; }
  .topbar .brand { display: flex; }
  .topbar .brand-tag { display: none; }
  .save-state .save-label { display: none; }
  .page { padding: 4px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bottomnav {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottomnav a {
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted);
    text-decoration: none; padding: 4px 2px; border-radius: 10px; line-height: 1.25; text-align: center;
  }
  .bottomnav a[aria-current="page"] { color: var(--accent-text); }
}

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px;
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; line-height: 1.4; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 7px; }
.btn.icon.sm { padding: 5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; padding: 4px 11px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.card.pad { padding: 20px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.6;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
.chip.sky { background: var(--sky-soft); color: var(--sky); }
.chip.outline { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grow { flex: 1; min-width: 0; }
.hide-sm { }
@media (max-width: 640px) { .hide-sm { display: none !important; } }

h1, h2, h3, h4 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 14px 0 22px; }
.page-head h1 { font-size: 28px; font-weight: 700; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.section { margin-top: 30px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 18px; font-weight: 650; }


/* Dashboard 2026: compact vertical upcoming list beside a real date-driven exam calendar. */
.dashboard-exam-layout { display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start; }
.dashboard-exam-panel { min-width:0; }
.dashboard-exam-panel .section-head { margin-bottom:12px; }
.dashboard-upcoming-list { list-style:none;padding:0;margin:0; }
.dashboard-upcoming-row { display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0; }
.dashboard-upcoming-row:first-child { padding-top:2px; }
.dashboard-upcoming-row:last-child { border-bottom:0;padding-bottom:2px; }
.dashboard-upcoming-row .date-pill { width:45px;padding:5px 2px;border-radius:11px; }
.dashboard-upcoming-row .upcoming-info { flex:1;min-width:0; }
.dashboard-upcoming-row .upcoming-course-title { font-size:13.5px;line-height:1.35;font-weight:680; }
.dashboard-upcoming-row .upcoming-meta { margin-top:4px;gap:4px 7px; }
.dashboard-upcoming-row .btn { flex:none;white-space:nowrap; }
.dashboard-calendar-head { display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px; }
.dashboard-calendar-heading { font-size:14px;font-weight:700; }
.dashboard-calendar-controls { display:flex;align-items:center;gap:6px; }
.dashboard-calendar-controls .btn { padding:4px 7px;min-width:28px; }
.dashboard-cal-grid { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px; }
.dashboard-cal-weekday { font-size:11px;color:var(--muted);font-weight:650;text-align:center;padding:7px 0; }
.dashboard-cal-cell { min-height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:12px;font-weight:550;position:relative; }
button.dashboard-cal-cell { cursor:pointer; }
.dashboard-cal-cell.has-exam { background:var(--accent-soft);color:var(--accent-text);font-weight:800; }
.dashboard-cal-cell.has-exam::after { content:'';position:absolute;bottom:3px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--accent); }
.dashboard-cal-cell.chosen { border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent); }
.dashboard-cal-cell.today { border-color:var(--line-strong); }
.dashboard-calendar-legend { font-size:12px;font-weight:650;color:var(--muted);margin:12px 0 4px; }
.dashboard-cal-event { display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);min-width:0; }
.dashboard-cal-event .date-pill { width:39px;padding:4px 0;border-radius:8px; }
.dashboard-cal-event .date-pill b { font-size:13px; }
.dashboard-cal-event-main { min-width:0;flex:1; }
.dashboard-cal-event-name { font-size:12.5px;font-weight:650;line-height:1.35;overflow-wrap:anywhere; }
.dashboard-cal-event-type { font-size:11px;color:var(--muted);margin-top:2px; }
.dashboard-calendar-note { margin-top:9px;font-size:11px;line-height:1.5;color:var(--muted); }
@media (max-width: 1050px) { .dashboard-exam-layout { grid-template-columns:1fr; } }
@media (max-width: 640px) { .dashboard-exam-layout { gap:12px; } .dashboard-upcoming-row { padding:10px 0;gap:9px; } .dashboard-upcoming-row .upcoming-course-title { font-size:13px; } .dashboard-exam-panel { padding:13px !important; } }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.req { color: var(--bad); margin-left: 2px; }
.input, .select, .textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface);
  font-size: 15px; transition: border-color .15s, box-shadow .15s; min-width: 0;
}
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.err { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.textarea { min-height: 76px; resize: vertical; }
.hint { font-size: 12.5px; color: var(--muted); }
.error-text { font-size: 12.5px; color: var(--bad); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; outline-offset: 2px; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.input-group { display: flex; align-items: stretch; }
.input-group .input { border-radius: 10px 0 0 10px; }
.input-group .addon { display: grid; place-items: center; padding: 0 12px; border: 1px solid var(--line-strong); border-left: 0; border-radius: 0 10px 10px 0; background: var(--surface-2); color: var(--muted); font-size: 14px; white-space: nowrap; }

/* ---------- metrics ---------- */
.metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1180px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.metric { padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.metric .m-label { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 5px; line-height: 1.35; }
.metric .m-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 6px; font-variant-numeric: tabular-nums; }
.metric .m-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.metric.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.metric.hero .m-label, .metric.hero .m-sub { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }

/* ---------- grade bar (signature element) ---------- */
.gbar { position: relative; }
.gbar-track { position: relative; display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.gbar.lg .gbar-track { height: 22px; border-radius: 8px; }
.gbar-seg { height: 100%; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.gbar-seg.earned { background: var(--earned); }
.gbar-seg.lost { background: var(--lost); }
.gbar-seg.pending { background: repeating-linear-gradient(-45deg, var(--pending-a) 0 6px, var(--pending-b) 6px 12px); }
.gbar-seg.unassigned { background: transparent; }
.gbar-ticks { position: absolute; inset: 0; pointer-events: none; }
.gbar-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; border-radius: 2px; }
.gbar-tick.target { opacity: 1; background: var(--ink); width: 2px; }
.gbar.lg .gbar-tick { opacity: .28; top: 0; bottom: 0; width: 1px; }
.gbar.lg .gbar-tick.target { opacity: 1; width: 2px; top: -5px; bottom: -5px; }
.gbar-labels { position: relative; height: 18px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.gbar-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-weight: 600; }
.gbar-labels span.target { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.earned { background: var(--earned); }
.legend i.lost { background: var(--lost); }
.legend i.pending { background: repeating-linear-gradient(-45deg, var(--pending-a) 0 3px, var(--pending-b) 3px 6px); border: 1px solid var(--pending-a); }
.legend i.unassigned { border: 1px dashed var(--line-strong); }

/* ---------- course cards ---------- */
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .course-grid { grid-template-columns: 1fr; } }
.ccard { position: relative; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.ccard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cc, var(--accent)); }
.ccard-top { display: flex; align-items: flex-start; gap: 12px; }
.ccard-name { font-weight: 650; font-size: 16px; line-height: 1.35; }
.ccard-meta { font-size: 12.5px; color: var(--muted); }
.grade-badge {
  flex: none; min-width: 52px; text-align: center; padding: 4px 8px 5px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); line-height: 1.15;
}
.grade-badge b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.grade-badge small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; white-space: nowrap; }
.grade-badge.confirmed { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.grade-badge.confirmed small { color: var(--ok); }
.grade-badge.calculated { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.grade-badge.calculated small { color: var(--accent-text); }
.grade-badge.estimated { border-style: dashed; border-color: var(--line-strong); background: transparent; }
.grade-badge.none b { color: var(--muted); }
.ccard-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ccard-stats div { min-width: 0; }
.ccard-stats .k { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.ccard-stats .v { font-weight: 650; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.ccard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--cc, var(--accent)); }

/* ---------- course detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; margin-top: 10px; }
.back:hover { color: var(--ink); }
.course-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 12px 0 18px; }
.course-head h1 { font-size: 26px; font-weight: 700; }
.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
@media (max-width: 720px) { .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sum-cell { background: var(--surface); padding: 14px 16px; min-width: 0; }
.sum-cell .k { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; line-height: 1.35; }
.sum-cell .k b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; flex: none; }
.sum-cell .v { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sum-cell .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.sum-cell .d { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
.banner svg { flex: none; margin-top: 2px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--sky-soft); color: var(--ink-2); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }

/* assessment list */
.alist { display: flex; flex-direction: column; }
.arow {
  display: grid; grid-template-columns: minmax(0, 2.2fr) 74px minmax(150px, 1.25fr) 86px minmax(110px, 1fr) 72px;
  gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line);
}
.arow.head { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 10px; padding-bottom: 8px; }
.arow.cat { background: var(--surface-2); padding-top: 10px; padding-bottom: 10px; }
.arow.child { padding-left: 34px; }
.a-name { font-weight: 600; line-height: 1.35; }
.a-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); margin-top: 3px; align-items: center; }
.score-in { display: flex; align-items: center; gap: 6px; }
.score-in .input { width: 76px; padding: 6px 9px; font-size: 14.5px; text-align: right; font-variant-numeric: tabular-nums; }
.score-in span { color: var(--muted); white-space: nowrap; font-size: 14px; }
.contrib b { font-variant-numeric: tabular-nums; font-size: 15px; }
.contrib small { color: var(--muted); font-size: 12.5px; }
.minibar { height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 5px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--earned); border-radius: 4px; }
.r-actions { display: flex; justify-content: flex-end; gap: 2px; }
.cell-label { display: none; }
@media (max-width: 820px) {
  .arow { grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 14px 14px; }
  .arow.head { display: none; }
  .arow .a-main { grid-column: 1 / -1; display: flex; gap: 10px; align-items: flex-start; }
  .arow .r-actions { position: static; }
  .arow.child { padding-left: 24px; }
  .cell-label { display: block; font-size: 11.5px; color: var(--muted); }
}
.status-btn { border: 0; cursor: pointer; }
@media (max-width: 560px) {
  .arow:not(.head):not(.cat) { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "main main act" "w ctr sc"; gap: 6px 12px; padding: 11px 12px; align-items: end; }
  .arow .a-main { grid-area: main; } .arow .r-actions { grid-area: act; align-self: start; margin: -4px -6px 0 0; }
  .arow .c-w { grid-area: w; } .arow .contrib { grid-area: ctr; } .arow .c-s { grid-area: sc; }
  .arow .c-p { display: none; }
  .arow.child:not(.cat) { padding-left: 22px; }
  .arow .score-in .input { width: 62px; padding: 5px 7px; }
  .arow .cell-label { font-size: 11px; margin-bottom: 1px; }
  .arow .contrib b { font-size: 14px; }
  .alist-actions { width: 100%; }
  .alist-actions .btn { flex: 1 1 auto; justify-content: center; }
  .summary-grid { display: flex; flex-direction: column; }
  .sum-cell { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 13px; }
  .sum-cell .v { font-size: 17px; margin-top: 0; white-space: nowrap; }
  .sum-cell .v small { font-size: 12.5px; }
  .sum-cell .d { display: none; }
}

/* ---------- simulator ---------- */
.sim-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
@media (max-width: 720px) { .sim-head { grid-template-columns: 1fr; } }
.verdict { padding: 18px 20px; border-radius: var(--r-lg); background: var(--accent-soft); color: var(--ink); }
.verdict.impossible { background: var(--bad-soft); }
.verdict.secured { background: var(--ok-soft); }
.verdict-main { font-size: 19px; font-weight: 650; line-height: 1.45; }
.verdict-main .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.verdict-sub { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.ladder { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.rung { padding: 9px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.rung[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.rung b { font-size: 17px; display: block; }
.rung span { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); display: block; line-height: 1.35; }
.rung.impossible span { color: var(--bad); }
.rung.secured span { color: var(--ok); }
.slider-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 120px; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.slider-row:first-child { border-top: 0; }
@media (max-width: 640px) { .slider-row { grid-template-columns: 1fr auto; } .slider-row input[type=range] { grid-column: 1 / -1; grid-row: 2; } }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.sim-result { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .sim-result { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sim-result div { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.sim-result .k { font-size: 12px; color: var(--muted); line-height: 1.35; }
.sim-result .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .sim-result { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
  .sim-result > div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-radius: 0; padding: 9px 13px; }
  .sim-result > div > * { margin: 0 !important; }
  .sim-result .v { font-size: 17px; white-space: nowrap; }
  .sim-result .tiny { display: none; }
}

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--r-md); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .input, .tbl .select { padding: 6px 9px; font-size: 14px; }
.tbl tr.sub td { background: var(--surface-2); font-weight: 600; }

/* ---------- years ---------- */
.year { padding: 0; overflow: hidden; }
.year-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; flex-wrap: wrap; }
.year-head h3 { font-size: 18px; font-weight: 650; }
.sem { border-top: 1px solid var(--line); padding: 14px 18px; }
.sem-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sem-head h4 { font-size: 15.5px; font-weight: 650; }
.sem-courses { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.sem-course { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
.sem-course a { color: var(--ink); text-decoration: none; font-weight: 550; }
.sem-course a:hover { color: var(--accent-text); }
.sem-course .select { width: auto; max-width: 200px; padding: 4px 8px; font-size: 13px; }
.stat-inline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stat-inline b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- chart ---------- */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); }
.chart-tip { font-size: 13px; color: var(--ink-2); min-height: 22px; margin-top: 4px; }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(20, 19, 38, .42); display: flex; align-items: center; justify-content: center;
  padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  animation: fade .16s ease-out;
}
.modal {
  width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg); border: 1px solid var(--line); animation: rise .2s cubic-bezier(.2,.8,.2,1);
}
.modal.wide { max-width: 720px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 22px 4px; }
.modal-head h2 { font-size: 19px; font-weight: 650; }
.modal-body { padding: 14px 22px 8px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 20px; flex-wrap: wrap; }
@media (max-width: 560px) {
  .overlay { align-items: flex-end; padding: 0; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
  .modal { border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal-foot .btn { flex: 1; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.calc-preview { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: 14px; display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: baseline; }
.calc-preview b { font-variant-numeric: tabular-nums; font-size: 16px; }

/* ---------- toast ---------- */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100vw - 24px); }
@media (max-width: 900px) { .toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg);
  box-shadow: var(--shadow-lg); font-size: 14px; animation: rise .2s ease-out;
}
.toast button { background: transparent; border: 0; color: var(--lav); font-weight: 700; cursor: pointer; padding: 4px 6px; }

/* ---------- empty course guidance (inline, not a setup wizard) ---------- */
.empty { text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-xl); background: var(--surface); }
.empty h3 { font-size: 18px; margin-bottom: 6px; }
.empty p { color: var(--muted); margin: 0 auto 16px; max-width: 46ch; }
.empty p.no-wrap { max-width: none; white-space: nowrap; }
@media (max-width: 900px) { .empty p.no-wrap { white-space: normal; max-width: 46ch; } }
.course-start {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px;
  padding: 20px 22px; border: 1px solid var(--line-strong);
  border-radius: 18px; background: var(--surface);
  box-shadow: var(--shadow); max-width: 860px; margin: 6px auto 0;
}
.course-start-kicker {
  grid-column: 1 / -1; display: inline-flex; align-items: center; gap: 7px; width: fit-content;
  padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text);
  font-size: 11.5px; font-weight: 700;
}
.course-start h2 {
  grid-column: 1; font-size: clamp(18px, 2.3vw, 24px); line-height: 1.28; margin: 0; letter-spacing: -.02em;
}
.course-start-desc {
  grid-column: 1; margin: 0; max-width: 56ch; color: var(--ink-2); font-size: 14px; line-height: 1.65;
}
.course-start-steps {
  grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; margin: 2px 0 0;
}
.course-start-step {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px;
  font-size: 12.5px; color: var(--ink-2); background: var(--surface-2);
}
.course-start-step b {
  display: grid; place-items: center; width: 20px; height: 20px; flex: none;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-size: 11px;
}
.course-start-action {
  grid-column: 2; grid-row: 2 / span 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  justify-content: flex-end; align-self: center;
}
.course-start-action .btn { padding: 9px 14px; }
.course-start-action .btn.primary { font-weight: 700; }
@media (max-width: 720px) {
  .course-start {
    grid-template-columns: 1fr; gap: 10px; padding: 18px;
  }
  .course-start-kicker, .course-start h2, .course-start-desc, .course-start-steps, .course-start-action {
    grid-column: auto; grid-row: auto;
  }
  .course-start-steps { margin-top: 4px; }
  .course-start-action { justify-content: flex-start; }
}
@media (max-width: 540px) {
  .course-start-action { align-items: stretch; flex-direction: column; }
  .course-start-action .btn { justify-content: center; }
}
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.list-plain { margin: 0; padding: 0; list-style: none; }
.upcoming li { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.upcoming li:first-child { border-top: 0; }
.upcoming-info { min-width: 0; }
.upcoming-course-title { font-size: 14px; font-weight: 650; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.upcoming-meta { display: flex; align-items: center; gap: 5px 8px; flex-wrap: wrap; margin-top: 5px; min-width: 0; }
.upcoming-type { display: inline-flex; align-items: center; flex: none; border-radius: 6px; padding: 2px 7px; line-height: 1.4; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 650; }
.upcoming-detail { min-width: 0; color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.upcoming-due { color: var(--muted); font-size: 12px; }
@media (max-width: 440px) { .upcoming li { gap: 8px; } .upcoming li > .btn { padding: 5px 8px; font-size: 12px; } }
.date-pill { flex: none; width: 46px; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 4px 0; line-height: 1.2; }
.date-pill b { display: block; font-size: 16px; }
.date-pill small { font-size: 11px; color: var(--muted); }
.two-col { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }
.tip { position: relative; display: inline-flex; color: var(--muted); cursor: help; vertical-align: middle; }
.tip:focus-visible { outline: 2px solid var(--accent); }
.tip .tip-body {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 260px;
  background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 400; line-height: 1.5; padding: 8px 10px; border-radius: 9px;
  opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 40; white-space: normal; text-align: left;
}

<script>
/* ===== GradeSpace calculation engine (pure, no UI) ===== */
var Calc = (function () {
  'use strict';
  var EPS = 1e-9;
  var W_TOL = 0.005; // tolerance when comparing weight totals to 100

  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function toNum(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim().replace(',', '.');
    if (s === '') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function sum(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return s; }

  /* ---- formatting (display only; never used to feed calculations) ---- */
  function fmt(n, d) {
    if (!isNum(n)) return '–';
    if (d === undefined) d = 2;
    var s = n.toFixed(d);
    if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
    return s;
  }
  // Up to `d` decimals, trailing zeros trimmed (for user-entered values like 45 or 8.5)
  function fmtT(n, d) {
    if (!isNum(n)) return '–';
    var s = fmt(n, d === undefined ? 2 : d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  /* ---- grading scales ---- */
  function scaleFor(course, state) {
    var id = course && course.scaleId;
    return state.scales.find(function (s) { return s.id === id; }) ||
      state.scales.find(function (s) { return s.id === state.settings.defaultScaleId; }) ||
      state.scales[0] || null;
  }
  function gradesFor(course, state) {
    if (course && course.customGrades && course.customGrades.length) return course.customGrades;
    var sc = scaleFor(course, state);
    return sc ? sc.grades : [];
  }
  function sortedGrades(grades) {
    return grades.slice().filter(function (g) { return isNum(g.min); }).sort(function (a, b) { return b.min - a.min; });
  }
  function letterFor(pct, grades) {
    if (!isNum(pct)) return null;
    var g = sortedGrades(grades);
    for (var i = 0; i < g.length; i++) if (pct >= g[i].min - EPS) return g[i];
    return g.length ? g[g.length - 1] : null;
  }
  function maxPoints(grades) {
    var m = 0;
    grades.forEach(function (g) { if (isNum(g.points) && g.points > m) m = g.points; });
    return m;
  }

  /* ---- assessment weights ---- */
  // Effective share of the course grade (in percentage points) for each assessment.
  // Category weight is distributed across its items, never counted twice.
  function effectiveWeights(courseId, state) {
    var items = state.assessments.filter(function (a) { return a.courseId === courseId; });
    var cats = state.categories.filter(function (c) { return c.courseId === courseId; });
    var map = {};
    items.forEach(function (a) {
      var cat = a.categoryId ? cats.find(function (c) { return c.id === a.categoryId; }) : null;
      if (!cat || cat.dist === 'manual') { var w = toNum(a.weight); map[a.id] = w && w > 0 ? w : 0; return; }
      var members = items.filter(function (x) { return x.categoryId === cat.id; });
      var cw = toNum(cat.weight) || 0;
      if (cat.dist === 'points') {
        var tot = sum(members.map(function (m) { var mx = toNum(m.max); return mx && mx > 0 ? mx : 0; }));
        var mine = toNum(a.max);
        map[a.id] = tot > 0 && mine > 0 ? cw * mine / tot : 0;
      } else {
        map[a.id] = members.length ? cw / members.length : 0;
      }
    });
    return map;
  }

  function isGraded(a) {
    return a.status === 'graded' && isNum(a.score) && isNum(a.max) && a.max > 0;
  }

  /* ---- course summary ---- */
  function courseSummary(course, state) {
    var items = state.assessments.filter(function (a) { return a.courseId === course.id; });
    var W = effectiveWeights(course.id, state);
    var rows = items.map(function (a) {
      var w = W[a.id] || 0;
      var g = isGraded(a);
      var ratio = g ? a.score / a.max : null;
      var pred = (!g && isNum(a.predicted) && isNum(a.max) && a.max > 0) ? a.predicted / a.max * w : null;
      return { a: a, id: a.id, w: w, max: a.max, graded: g, ratio: ratio, pct: g ? ratio * 100 : null,
        contrib: g ? ratio * w : null, predContrib: pred, virtual: false, extra: !!a.extra };
    });
    // A category with a declared weight but no items yet is still planned, pending weight.
    state.categories.forEach(function (c) {
      if (c.courseId !== course.id || c.dist === 'manual') return;
      var has = items.some(function (a) { return a.categoryId === c.id; });
      var cw = toNum(c.weight) || 0;
      if (!has && cw > 0) {
        rows.push({ a: { id: 'cat:' + c.id, name: c.name, type: c.type, max: 100, categoryId: c.id, status: 'pending' },
          id: 'cat:' + c.id, w: cw, max: 100, graded: false, ratio: null, pct: null, contrib: null,
          predContrib: null, virtual: true, extra: false });
      }
    });

    var gradedRows = rows.filter(function (r) { return r.graded; });
    var pendingRows = rows.filter(function (r) { return !r.graded; });
    var totalWeight = sum(rows.map(function (r) { return r.w; }));
    var earned = sum(gradedRows.map(function (r) { return r.contrib; }));
    var gradedWeight = sum(gradedRows.map(function (r) { return r.w; }));
    var pendingWeight = sum(pendingRows.map(function (r) { return r.w; }));
    var unassigned = Math.max(0, 100 - totalWeight);
    var remaining = Math.max(0, 100 - gradedWeight);
    var performance = gradedWeight > EPS ? earned / gradedWeight * 100 : null;
    var maxPossible = earned + remaining;
    var maxPlanned = earned + pendingWeight; // ceiling using only assessments that exist

    // Each ungraded item is assumed to score like the same kind of work already graded:
    // remaining exams like the exams so far (e.g. the final like the midterm), homework like the
    // graded homework in its category or type. Only when nothing comparable is graded does it use
    // overall performance. Pending work is never counted as zero.
    var perfOf = function (list) {
      var w = sum(list.map(function (g) { return g.w; }));
      return w > EPS ? sum(list.map(function (g) { return g.contrib; })) / w * 100 : null;
    };
    var examType = function (t) { return t === 'midterm' || t === 'final'; };
    pendingRows.forEach(function (r) {
      var a = r.a, pct = null, from = 'overall';
      if (examType(a.type)) { pct = perfOf(gradedRows.filter(function (g) { return examType(g.a.type); })); from = 'exams'; }
      if (pct === null && a.categoryId) { pct = perfOf(gradedRows.filter(function (g) { return g.a.categoryId === a.categoryId; })); from = 'category'; }
      if (pct === null && !examType(a.type)) { pct = perfOf(gradedRows.filter(function (g) { return g.a.type === a.type; })); from = 'type'; }

    if (!d || !d.marker) return;
    d.marker.el.classList.remove('sort-drop-before', 'sort-drop-after');
    d.marker = null;
  };
  var position = function (d) {
    var el = els.current[d.id], grid = box.current;
    if (!el || !grid) return;
    var r = grid.getBoundingClientRect();
    var left = d.clientX - r.left - d.grabX;
    var top = d.clientY - r.top - d.grabY;
    el.style.transform = 'translate3d(' + (left - d.originalLeft) + 'px,' + (top - d.originalTop) + 'px,0)';
    var x = d.clientX - r.left, y = d.clientY - r.top;
    var others = d.ids.filter(function (id) { return id !== d.id; });
    var before = 0;
    others.forEach(function (id) {
      var peer = els.current[id]; if (!peer) return;
      var midX = peer.offsetLeft + peer.offsetWidth / 2;
      var midY = peer.offsetTop + peer.offsetHeight / 2;
      // Treat each row as one horizontal band. Never depend on transformed rectangles.
      var rowBand = Math.min(65, peer.offsetHeight * .3);
      if (y > midY + rowBand || (y >= midY - rowBand && x > midX)) before++;
    });
    d.targetIndex = Math.max(0, Math.min(before, others.length));
    var markerId = d.targetIndex < others.length ? others[d.targetIndex] : others[others.length - 1];
    var markerEl = els.current[markerId];
    var markerClass = d.targetIndex < others.length ? 'sort-drop-before' : 'sort-drop-after';
    if (d.marker && (d.marker.el !== markerEl || d.marker.cls !== markerClass)) clearMarker(d);
    if (markerEl && (!d.marker || d.marker.el !== markerEl)) {
      markerEl.classList.add(markerClass);
      d.marker = { el: markerEl, cls: markerClass };
    }
  };
  var stop = function (save) {
    var d = drag.current; if (!d) return;
    drag.current = null;
    cancelAnimationFrame(frame.current); frame.current = 0;
    window.removeEventListener('pointermove', d.onMove);
    window.removeEventListener('pointerup', d.onUp);
    window.removeEventListener('pointercancel', d.onCancel);
    window.removeEventListener('keydown', d.onKey);
    window.removeEventListener('blur', d.onBlur);
    try { if (d.handle.hasPointerCapture(d.pointerId)) d.handle.releasePointerCapture(d.pointerId); } catch (err) {}
    clearMarker(d);
    document.body.classList.remove('is-sorting');
    var el = els.current[d.id];
    if (el) {
      el.classList.remove('dragging');
      el.style.transition = '';
      el.style.transform = '';
    }
    if (!save) return;
    var final = d.ids.filter(function (id) { return id !== d.id; });
    final.splice(d.targetIndex, 0, d.id);
    if (!same(final, d.ids)) {
      p.onReorder(final);
      setMsg(t('sort.moved', { name: p.label(d.id), i: final.indexOf(d.id) + 1, n: final.length }));
    }
  };
  var tick = function () {
    var d = drag.current; if (!d) return;
    var h = window.innerHeight, top = 110, bottom = h - (window.innerWidth <= 900 ? 120 : 70);
    var sp = d.clientY < top ? -Math.ceil((top - d.clientY) / 5)
      : d.clientY > bottom ? Math.ceil((d.clientY - bottom) / 5) : 0;
    if (sp) {
      window.scrollBy(0, Math.max(-24, Math.min(24, sp)));
      position(d);
    }
    frame.current = requestAnimationFrame(tick);
  };
  var start = function (id, ev) {
    if (drag.current || p.disabled || p.ids.length < 2) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    var el = els.current[id], grid = box.current;
    if (!el || !grid) return;
    ev.preventDefault();
    var rect = grid.getBoundingClientRect();
    var d = {
      id: id, ids: p.ids.slice(), handle: ev.currentTarget, pointerId: ev.pointerId,
      clientX: ev.clientX, clientY: ev.clientY,
      originalLeft: el.offsetLeft, originalTop: el.offsetTop,
      grabX: ev.clientX - rect.left - el.offsetLeft,
      grabY: ev.clientY - rect.top - el.offsetTop,
      targetIndex: p.ids.indexOf(id), marker: null
    };
    d.onMove = function (e) {
      if (e.pointerId !== d.pointerId) return;
      d.clientX = e.clientX; d.clientY = e.clientY;
      if (e.cancelable) e.preventDefault();
      position(d);
    };
    d.onUp = function (e) {
      if (e.pointerId !== d.pointerId) return;
      d.clientX = e.clientX; d.clientY = e.clientY;
      position(d); stop(true);
    };
    d.onCancel = function (e) { if (e.pointerId === d.pointerId) stop(false); };
    d.onKey = function (e) { if (e.key === 'Escape') { e.preventDefault(); stop(false); } };
    d.onBlur = function () { stop(false); };
    drag.current = d;
    window.addEventListener('pointermove', d.onMove);
    window.addEventListener('pointerup', d.onUp);
    window.addEventListener('pointercancel', d.onCancel);
    window.addEventListener('keydown', d.onKey);
    window.addEventListener('blur', d.onBlur);
    try { d.handle.setPointerCapture(ev.pointerId); } catch (err) {}
    el.classList.add('dragging'); el.style.transition = 'none';
    document.body.classList.add('is-sorting');
    frame.current = requestAnimationFrame(tick);
  };
  var moveBy = function (id, delta, ev) {
    var cur = p.ids.slice(), i = cur.indexOf(id);
    var j = delta === 'start' ? 0 : delta === 'end' ? cur.length - 1 : i + delta;
    if (ev) ev.preventDefault();
    if (j < 0 || j >= cur.length || j === i || drag.current) return;
    cur.splice(i, 1); cur.splice(j, 0, id);
    p.onReorder(cur);
    setMsg(t('sort.moved', { name: p.label(id), i: j + 1, n: cur.length }));
  };
  useEffect(function () {
    return function () {
      // Cleanup if the page changes mid-drag; no state mutation during unmount.
      var d = drag.current;
      if (d) {
        window.removeEventListener('pointermove', d.onMove);
        window.removeEventListener('pointerup', d.onUp);
        window.removeEventListener('pointercancel', d.onCancel);
        window.removeEventListener('keydown', d.onKey);
        window.removeEventListener('blur', d.onBlur);
        clearMarker(d);
        var el = els.current[d.id];
        if (el) { el.classList.remove('dragging'); el.style.transform = ''; el.style.transition = ''; }
        drag.current = null;
      }
      cancelAnimationFrame(frame.current);
      document.body.classList.remove('is-sorting');
    };
  }, []);
  return html`<div className=${'course-grid sortable' + (p.disabled ? ' sort-off' : '')} ref=${box}>
    ${p.ids.map(function (id) {
      var handle = p.disabled ? null : html`<button type="button" className="btn ghost icon sm drag-handle" aria-label=${t('sort.handle', { name: p.label(id) })}
        aria-describedby="sort-help" onPointerDown=${function (e) { start(id, e); }}
        onKeyDown=${function (e) {
          if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') moveBy(id, -1, e);
          else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') moveBy(id, 1, e);
          else if (e.key === 'Home') moveBy(id, 'start', e);
          else if (e.key === 'End') moveBy(id, 'end', e);
        }}><${Icon} n="grip" s=${18} /></button>`;
      return html`<div key=${id} className="sort-item" ref=${function (el) { if (el) els.current[id] = el; else delete els.current[id]; }}>${p.render(id, handle)}</div>`;
    })}
    <span className="sr-only" aria-live="polite">${msg}</span>
  </div>`;
}

function dashboardEvents(state,courses,items){
  var events=[];
  courses.forEach(function(c){
    if(c.finalGrade)return;
    var ex=examsFor(c,state)||{},seen={};
    [['mid','midterm'],['fin','final']].forEach(function(k){
      var e=ex[k[0]], aa=items.filter(function(a){return a.courseId===c.id&&a.type===k[1];});
      var due=aa.find(function(a){return a.due&&!C.isGraded(a);})||aa.find(function(a){return a.due;});
      var date=e&&e.date||due&&due.due;
      if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
      var a=Object.assign({},due||{id:'ex-'+c.id+k[0],type:k[1],name:''},{due:date});
      events.push({a:a,c:c,d:daysUntil(date),exam:true,examData:e||{date:date,time:'',location:''},done:aa.length>0&&aa.every(C.isGraded)});
      seen[k[1]]=true;
    });
    items.filter(function(a){return a.courseId===c.id&&!C.isGraded(a)&&a.due&&!seen[a.type];}).forEach(function(a){events.push({a:a,c:c,d:daysUntil(a.due),exam:false});});
  });
  return events.filter(function(x){return x.d!==null;}).sort(function(x,y){return x.a.due.localeCompare(y.a.due)||String(x.examData&&x.examData.time||'').localeCompare(String(y.examData&&y.examData.time||''));});
}

// Suggests the student's own courses (tap to open) and courses from the list they haven't added (tap to add).
// Tolerates typos and Thai keywords via Fuzzy.
function CourseSearch(p) {
  var state = p.state, q = p.q;
  var os = useState(false), open = os[0], setOpen = os[1];
  var as = useState(0), active = as[0], setActive = as[1];
  var blurT = useRef(null);
  var items = [];
  if (q.trim()) {
    var mine = state.courses.map(function (c) { return { c: c, s: Fuzzy.score(q, p.courseFields(c)) }; })
      .filter(function (x) { return x.s >= 0; }).sort(function (a, b) { return a.s - b.s; }).slice(0, 6);
    var have = {};
    state.courses.forEach(function (c) { have[String(c.code || '').split('.')[0]] = 1; });
    var cat = CATALOG.search(q, 12).filter(function (x) { return !have[x.code]; })
      .map(function (x) { return { x: x, s: Fuzzy.score(q, [x.code, x.n, x.aka]) }; });
    var bestS = cat.length ? cat[0].s : 0;
    // only suggestions about as good as the best one (drops weak look-alikes)
    var limit = bestS < 4 ? Math.max(bestS + 1, 2) : bestS;
    cat = cat.filter(function (o) { return o.s <= limit; }).slice(0, 5).map(function (o) { return o.x; });
    mine.forEach(function (x) { items.push({ kind: 'own', id: x.c.id, c: x.c, close: x.s >= 4 }); });
    cat.forEach(function (x) { items.push({ kind: 'cat', id: 'cat-' + x.code, x: x }); });
  }
  var choose = function (it) {
    if (!it) return;
    setOpen(false); p.setQ('');
    if (it.kind === 'own') go('course-' + it.c.id);
    else openModal('course', { semesterId: p.semesterId, catalogCode: it.x.code });
  };
  var onKey = function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setActive(Math.min(items.length - 1, active + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, active - 1)); }
    else if (e.key === 'Enter') { if (open && items[active]) { e.preventDefault(); choose(items[active]); } }
    else if (e.key === 'Escape') { if (open) { e.preventDefault(); setOpen(false); } }
  };
  var show = open && q.trim();
  var semOf = function (c) { var s = state.semesters.find(function (x) { return x.id === c.semesterId; }); return s ? semFull(state, s) : ''; };
  var row = function (it, i) {
    var on = i === active;
    var common = { id: 'cs-opt-' + i, role: 'option', 'aria-selected': on ? 'true' : 'false',
      onMouseDown: function (e) { e.preventDefault(); }, onMouseEnter: function () { setActive(i); }, onClick: function () { choose(it); } };
    if (it.kind === 'own') {
      return h('div', Object.assign({ key: it.id, className: 'cs-opt' + (on ? ' on' : '') }, common),
        html`<span className="dot" style=${{ '--cc': courseColor(it.c.color) }}></span>
          <span className="grow cs-text"><b>${courseDisplayTitle(it.c)}</b><span className="tiny muted">${[it.c.code, semOf(it.c)].filter(Boolean).join('  ')}</span></span>
          ${it.close && html`<span className="chip outline">${t('search.close')}</span>`}<span className="cs-act">${t('search.open')}</span>`);
    }
    return h('div', Object.assign({ key: it.id, className: 'cs-opt' + (on ? ' on' : '') }, common),
      html`<span className="cs-plus"><${Icon} n="plus" s=${14} /></span>
        <span className="grow cs-text"><b>${niceName(it.x.aka || it.x.n)}</b><span className="tiny muted">${it.x.code}  ${t('nCredits', { n: it.x.cr })}</span></span>
        ${it.x.tpl && html`<span className="chip ok">${t('cat.tplChip')}</span>`}<span className="cs-act">${t('search.add')}</span>`);
  };
  var firstCat = items.findIndex(function (it) { return it.kind === 'cat'; });
  return html`<div className="cs-box">
    <input className="input" type="search" autoComplete="off" role="combobox" aria-autocomplete="list" aria-controls="cs-list"
      aria-expanded=${show ? 'true' : 'false'} aria-activedescendant=${show && items[active] ? 'cs-opt-' + active : null}
      placeholder=${t('searchCourses')} aria-label=${t('searchCourses')} value=${q}
      onInput=${function (e) { p.setQ(e.target.value); setOpen(true); setActive(0); }}
      onFocus=${function () { clearTimeout(blurT.current); setOpen(true); }}
      onBlur=${function () { blurT.current = setTimeout(function () { setOpen(false); }, 120); }}
      onKeyDown=${onKey} />
    ${show && html`<div className="cs-list" id="cs-list" role="listbox" aria-label=${t('searchCourses')}>
      ${items.length && items[0].kind === 'own' ? html`<div className="cs-head">${t('search.mine')}</div>` : null}
      ${items.map(function (it, i) {
        return html`<${React.Fragment} key=${it.id}>${i === firstCat ? html`<div className="cs-head">${t('search.catalog')}</div>` : null}${row(it, i)}<//>`;
      })}
      ${!items.length && html`<div className="cs-empty">${t('search.none')}</div>`}
    </div>`}
  </div>`;
}

function GradeSummary(p) {
  var c = p.course, state = p.state, s = p.sum, grades = C.gradesFor(c, state);
  var criterion = gradingModeFor(c) === 'criterion';
  var tg = criterion ? (c.target ? grades.find(function (g) { return g.label === c.target; }) : null) :
    (numericGoalFor(c) !== null ? { min: numericGoalFor(c), label: fmtT(numericGoalFor(c)) + '%' } : null);
  var L = function (v) { if (!criterion) return t('grading.noLetterPredictionShort'); var g = C.letterFor(v, grades); return g ? g.label : '–'; };
  var basisText = s.basis === 'predictions' ? t('basis.pred') : s.basis === 'performance' ? t('basis.perf') : s.basis === 'mixed' ? t('basis.mixed', { n: s.nAssumed }) : t('basis.complete');

    ${s.issues.over && html`<${Banner} kind="bad">${t('warn.over', { n: fmtT(s.totalWeight) })}<//>`}
    ${s.issues.under && html`<${Banner} kind="info">${t('warn.under', { n: fmtT(s.totalWeight), r: fmtT(100 - s.totalWeight) })}<//>`}
    ${s.issues.overMax > 0 && html`<${Banner} kind="bad">${t('warn.overMax')}<//>`}

    <div className="summary-grid">
      <div className="sum-cell"><div className="k">${t('pointsEarned')}<${Tip} text=${t('tip.earnedPts')} /></div>
        <div className="v">${fmt(s.earned)} <small>/ ${fmtT(s.gradedWeight)}</small></div><div className="d">${t('d.earned')}</div></div>

        <div className="v">${s.performance != null ? fmt(s.performance) + '%' : '–'}</div><div className="d">${s.performance != null ? (criterion ? t('d.perf', { g: L(s.performance) }) : t('grading.scoreOnly')) : t('d.perfNone')}</div></div>
      <div className="sum-cell"><div className="k">${t('remainingWeight')}<${Tip} text=${t('tip.remain')} /></div>

function ScoreInput(p) {
  var a = p.a;
  var st = useState(a.score == null ? '' : String(a.score)), txt = st[0], setTxt = st[1];
  var es = useState(null), err = es[0], setErr = es[1];
  useEffect(function () { setTxt(a.score == null ? '' : String(a.score)); setErr(null); }, [a.score, a.max]);
  if (!isNum(a.max) || a.max <= 0) {
    return html`<button className="btn sm" onClick=${function () { openModal('assess', { courseId: a.courseId, id: a.id }); }}>${t('setMax')}</button>`;
  }
  var commitIt = function () {
    var v = txt.trim();
    if (v === '') { if (a.score != null) { setScore(a, null); toast(t('scoreCleared')); } setErr(null); return; }
    // "39/55" sets the score and the full score together
    var pr = parseScoreText(v), n = pr.ok ? pr.s : null, m = pr.ok && pr.m != null && pr.m > 0 ? pr.m : a.max;
    if (n === null) { setErr(t('err.number')); return; }
    if (n < 0) { setErr(t('err.negative')); return; }
    if (n > m && !a.extra) { setErr(t('err.overMax', { m: fmtT(m) })); return; }
    setErr(null);
    if (n !== a.score || m !== a.max || a.status !== 'graded') { setScore(a, n, m !== a.max ? m : null); setTxt(String(n)); toast(t('scoreSaved')); }
  };
  return html`<div>

function GoalPlanner(p) {
  var state = p.state, st = state.settings, pl = st.planner;
  var base = C.cumulativeStats(state, pl.includeInProgress ? 'estimated' : 'confirmed');
  var grades = C.sortedGrades(C.gradesFor(null, state)), maxPts = C.maxPoints(grades) || 4;
  var planned = toNum(st.plannedCredits);
  var suggested = planned != null ? Math.max(0, planned - base.gpaCredits) : null;
  var remaining = pl.remaining != null ? pl.remaining : suggested;
  var plan = C.gpaPlan(base.qp, base.gpaCredits, st.targetCGPA, remaining, maxPts);
  var rowsPts = (pl.rows || []).map(function (r) { var g = grades.find(function (x) { return x.label === r.grade; }); return { credits: r.credits, points: g ? g.points : null }; });
  var proj = C.projectGPA(base.qp, base.gpaCredits, rowsPts);
  var setPl = function (fn) { update(function (d) { fn(d.settings.planner, d.settings); }); };
  var topLabel = grades[0] ? grades[0].label : 'A';
  var msg = null, cls = 'info';
  if (plan) {
    if (plan.status === 'possible') { msg = t('plan.possible', { r: fmt(plan.required), n: fmtT(remaining), b: fmt(plan.best) }); cls = plan.required > maxPts * 0.9 ? 'warn' : 'info'; }
    else if (plan.status === 'impossible') { msg = t('plan.impossible', { t: fmt(st.targetCGPA), g: topLabel, m: fmtT(maxPts), n: fmtT(remaining), b: fmt(plan.best) }); cls = 'bad'; }
    else if (plan.status === 'secured') { msg = t('plan.secured', { t: fmt(st.targetCGPA), w: fmt(plan.worst) }); cls = 'ok'; }
    else if (plan.status === 'met') { msg = t('plan.met'); cls = 'ok'; }
    else { msg = t('plan.nocredits'); }
  }
  return html`<section className="card pad stack" aria-labelledby="plan-h">
    <div><h2 id="plan-h" style=${{ fontSize: 18 }}>${t('goalPlanner')}</h2><div className="small muted">${t('goalPlannerSub')}</div></div>
    <div className="grid3">
      <${Field} label=${t('targetCGPA')} id="pl-t" hint=${t('targetCGPAHint', { m: fmtT(maxPts) })}><${NumCell} label=${t('targetCGPA')} value=${st.targetCGPA} placeholder=${t('eg', { v: '3.50' })}
        onChange=${function (v) { update(function (d) { d.settings.targetCGPA = v; }); }} /><//>
      <${Field} label=${t('remainingCredits')} id="pl-r" hint=${suggested != null ? t('remainingHint', { p: fmtT(planned), c: fmtT(base.gpaCredits), s: fmtT(suggested) }) : t('remainingHint2')}>
        <${NumCell} label=${t('remainingCredits')} value=${remaining} placeholder=${t('eg', { v: '90' })} onChange=${function (v) { setPl(function (pp) { pp.remaining = v; }); }} /><//>
      <${Field} label=${t('startingPoint')} id="pl-b">
        <label className="check" style=${{ marginTop: 6 }}><input type="checkbox" checked=${!!pl.includeInProgress} onChange=${function (e) { var v = e.target.checked; setPl(function (pp) { pp.includeInProgress = v; }); }} />
          <span className="small">${t('includeInProgress')}</span></label>
        <div className="hint">${t('baseIs', { g: base.gpa != null ? fmt(base.gpa) : '–', c: fmtT(base.gpaCredits) })}</div><//>
    </div>
    ${msg ? html`<${Banner} kind=${cls}>${msg}<//>` : html`<p className="small muted" style=${{ margin: 0 }}>${t('plan.enter')}</p>`}
    <div>
      <div className="row between wrap" style=${{ marginBottom: 8 }}><div><div className="label">${t('whatIfGPA')}</div><div className="hint">${t('whatIfGPASub')}</div></div>
        <button className="btn sm" onClick=${function () { setPl(function (pp) { pp.rows.push({ id: Store.uid('p-'), name: '', credits: 3, grade: topLabel }); }); }}><${Icon} n="plus" s=${15} />${t('addFutureCourse')}</button></div>
      ${(pl.rows || []).length > 0 && html`<div className="table-wrap"><table className="tbl"><thead><tr><th>${t('courseName')}</th><th>${t('credits')}</th><th>${t('grade')}</th><th></th></tr></thead><tbody>
        ${pl.rows.map(function (r, i) {
          return html`<tr key=${r.id}>
            <td><input className="input" value=${r.name} placeholder=${t('futureN', { n: i + 1 })} aria-label=${t('courseName')} onChange=${function (e) { var v = e.target.value; setPl(function (pp) { pp.rows[i].name = v; }); }} /></td>

            <td style=${{ width: 44 }}><button className="btn ghost icon sm" aria-label=${t('remove')} onClick=${function () { setPl(function (pp) { pp.rows.splice(i, 1); }); }}><${Icon} n="x" s=${16} /></button></td>

function feedbackPost(action, payload) {
  var endpoint = feedbackEndpoint();
  if (!validSheetEndpoint(endpoint)) return Promise.reject(new Error('endpoint not configured'));

    body: new URLSearchParams({ action:action, payload:JSON.stringify(payload) }) });
}
function feedbackReadFiles(files) {
  var picks = Array.from(files || []).slice(0,3);
  if (picks.length > 3) return Promise.reject(new Error('max 3 images'));
  return Promise.all(picks.map(function (file) {
    if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type) || file.size > 650000) {
      return Promise.reject(new Error('Use JPG, PNG, WEBP or GIF, max 650 KB each'));
    }
    return new Promise(function (resolve,reject) {
      var fr = new FileReader(); fr.onerror = function () { reject(new Error('Cannot read image')); };
      fr.onload = function () { resolve({ name:file.name.slice(0,90), data:fr.result }); };
      fr.readAsDataURL(file);
    });
  }));
}

function qaEndpoint(){return window.GS_WEB && window.GS_WEB.qaEndpoint || '';}
function qaLoad(){
  var endpoint=qaEndpoint(); if(!validSheetEndpoint(endpoint))return Promise.resolve({ok:false,unconfigured:true,items:[]});
  return new Promise(function(resolve,reject){
    var cb='GSQAReply_'+Math.random().toString(36).slice(2),done=false,s=document.createElement('script');
    var timer=setTimeout(function(){finish(new Error('Q&A timed out'));},12000);
    function finish(err,data){if(done)return;done=true;clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);try{delete window[cb];}catch(e){};if(err)reject(err);else resolve(data);}
    window[cb]=function(data){finish(null,data);};
    s.onerror=function(){finish(new Error('Cannot load Q&A'));};
    s.src=endpoint+'?action=list&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(s);
  });
}
function qaPost(action,payload){
  if(!validSheetEndpoint(qaEndpoint()))return Promise.reject(new Error('Q&A API not configured'));
  // Apps Script does not allow a CORS preflight from browsers; server verifies all input.
  return fetch(qaEndpoint(),{method:'POST',mode:'no-cors',body:new URLSearchParams({action:action,payload:JSON.stringify(payload)})});
}

function syncScoreSheetSnapshot(email, state) {
  var endpoint = window.GS_WEB && window.GS_WEB.scoreEndpoint;
  if (!validSheetEndpoint(endpoint) || !email || !state) return;
  var snap = makeScoreSnapshot(email, state);
  // Avoid accidental huge payloads; users with large histories can still keep
  // working locally and in Supabase, without blowing Apps Script limits.
  if (snap.courses.length > 250 || snap.assessments.length > 1200 ||
      snap.categories.length > 700 || snap.gradeRules.length > 4000) return;
  var data = JSON.stringify(snap);
  if (data.length > 900000) return;
  try {
    // no-cors is needed for Apps Script Web Apps. The response is opaque:
    // actual delivery should be verified by inspecting the private Sheet.
    fetch(endpoint, { method: 'POST', mode: 'no-cors',
      body: new URLSearchParams({ action: 'sync', payload: data }) }).catch(function () {});
  } catch (e) { /* never block editing grades */ }
}

function startUser(user) {
  logRegistration(user.email);
  stopSync();
  var w = S.web; w.user = user;
  try { localStorage.removeItem('gradespace.mode'); localStorage.setItem(EMAIL_KEY, user.email); } catch (e) { /* ignore */ }
  S.localKey = Store.KEY + ':' + user.email;
  S.state = Store.Local.load(S.localKey) || freshState();
  S.sync = 'saving'; S.authScreen = false; S.ready = true; emit();
  var cloud = Store.makeEmailStore(w.client, user.email);
  var attempt = function () {
    if (w.user !== user) return;
    cloud.load().then(function (remote) {
      if (w.user !== user) return;
      var cur = S.state, curHas = cur.courses.length || cur.years.length;
      if (remote && (!curHas || remote.updatedAt >= cur.updatedAt)) {
        S.state = remote; Store.Local.save(remote, S.localKey);
      } else if (!remote && !curHas) {
        var guest = Store.Local.load();
        if (guest && (guest.courses.length || guest.years.length)) {
          guest.settings.onboarded = true; S.state = guest; Store.Local.save(guest, S.localKey); toast(t('auth.migrated'));
        }
      }
      S.cloud = cloud;
      S.unwatch = cloud.watch(function (fresh) {
        if (w.user === user && fresh.updatedAt > S.state.updatedAt) {
          S.state = fresh; Store.Local.save(fresh, S.localKey); S.sync = 'account';
          scheduleScoreSheetSync(); emit();
        }

      if (S.state === remote) { S.sync = 'account'; emit(); return; }

      emit();

    }, function () {
      if (w.user !== user) return;
      S.sync = 'error'; emit();
      setTimeout(attempt, 20000);
    });
  };

}

  var u = S.web.user;
  return html`<section className="card pad stack"><h2 style=${{ fontSize: 18 }}>${t('account')}</h2>
    ${u ? html`<div className="row wrap between">
        <div className="row"><span className="avatar lg">${initialOf(u)}</span><div className="small muted">${t('account.signedInAs', { e: u.email })}</div></div>
        <button className="btn" onClick=${function () { confirmDialog({ title: t('account.signOutQ'), body: t('account.signOutBody'), confirmLabel: t('account.signOut'), onConfirm: signOut }); }}>${t('account.signOut')}</button>
      </div>`
      : html`<p className="small muted" style=${{ margin: 0 }}>${t('account.guestP')}</p><div><button className="btn primary" onClick=${goAuth}>${t('account.signInBtn')}</button></div>`}
  </section>`;
}
function webBoot() {
  var cfg = window.GS_WEB;
  S.web = { client: window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: false, autoRefreshToken: false } }), user: null };
  var saved = null, guestPref = false;
  try {
    if (localStorage.getItem('gradespace.th-default-v1') !== '1') { localStorage.setItem('gradespace.th-default-v1', '1'); localStorage.setItem('gradespace.lang', 'th'); }
    var l = localStorage.getItem('gradespace.lang');
    if (l === 'th' || l === 'en') LANG = l; else LANG = 'th';
    saved = localStorage.getItem(EMAIL_KEY);
    guestPref = localStorage.getItem('gradespace.mode') === 'guest';
  } catch (e) { /* ignore */ }
  S.state = freshState();
  ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
  if (saved) startUser({ id: saved, email: saved });
  else if (guestPref) startGuest();
  else { S.authScreen = true; S.ready = true; emit(); }
}

/* ================= boot ================= */
function boot() {
  SharedCatalog.load(); // non-blocking public metadata; never holds up course entry or scoring
  if (window.GS_WEB && window.GS_WEB.url && window.supabase) { webBoot(); return; }
  var local = Store.Local.load();
  var hadLocal = !!local;
  S.state = local || Store.emptyState();
  var nav = (navigator.language || '').toLowerCase();
  LANG = S.state.settings.lang || 'th';
  ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
  // Show the app right away when this device already has data; otherwise wait briefly for an account copy.
  if (hadLocal) { S.ready = true; emit(); }
  var readyTimer = setTimeout(function () { if (!S.ready) { S.ready = true; emit(); } }, 3500);
  capUse('downloads').then(function (d) { S.downloads = d; });
  Promise.all([capUse('db'), capUse('user')]).then(function (r) {
    var db = r[0], user = r[1];
    if (!db || !user) return null;
    return user.id().then(function (id) {
      if (!id) return null;
      var cloud = Store.makeCloud(db, id);
      var timeout = new Promise(function (res) { setTimeout(function () { res('timeout'); }, 10000); });
      return Promise.race([cloud.load(), timeout]).then(function (remote) {
        if (remote === 'timeout') return null;
        S.cloud = cloud;
        cloud.watch(function (fresh) {
          if (fresh.updatedAt > S.state.updatedAt) {
            S.state = fresh; Store.Local.save(fresh); S.sync = 'account'; emit();
          }
        });
        var localNow = S.state;
        var localHasData = hadLocal && (localNow.courses.length || localNow.years.length);
        if (remote && (!localHasData || remote.updatedAt > localNow.updatedAt)) {
          S.state = remote; Store.Local.save(remote); S.sync = 'account';
        } else if (localHasData || localNow.settings.onboarded) {
          S.sync = 'saving'; cloud.save(localNow).then(function (x) { S.sync = x === 'ok' ? 'account' : 'error'; emit(); });
        } else { S.sync = 'account'; }
        return true;
      });
    }).catch(function () { return null; });
  }).then(function () {
    clearTimeout(readyTimer);
    if (!S.ready) S.ready = true;
    emit();
  });
}
window.GradeSpace = { S: S, update: update, Calc: C };
boot();
})();

</script>
<script>
window.setTimeout(function () {
  var el = document.getElementById('root');
  if (!window.GradeSpace && el && !el.hasChildNodes()) {
    el.innerHTML = '<main style="max-width:600px;margin:12vh auto;padding:24px;font:16px sans-serif">' +
      '<h2>ไม่สามารถโหลด GradeSpace ได้</h2>' +
      '<p>ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วลองโหลดหน้าอีกครั้ง</p>' +
      '<button onclick="location.reload()" style="padding:10px 14px;cursor:pointer">ลองอีกครั้ง</button>' +
      '</main>';
  }
}, 4500);
</script>
