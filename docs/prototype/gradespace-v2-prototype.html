<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GradeSpace Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #F7F7FB; --surface: #FFFFFF; --surface-2: #F2F1FA; --surface-3: #E9E7F7;
  --line: #E5E3F0; --line-strong: #D2CFE5;
  --ink: #1D1B36; --ink-2: #47456A; --muted: #75739A;
  --accent: #4F46E5; --accent-hover: #4338CA; --accent-ink: #FFFFFF; --accent-soft: #ECEBFF; --accent-text: #4338CA;
  --lav: #A5A0F5; --sky: #4C9BEA; --sky-soft: #E2EFFD;
  --earned: #4F46E5; --lost: #DCD9EE; --pending-a: #CFE3FB; --pending-b: #E6F0FD;
  --ok: #157A52; --ok-soft: #E2F4EB; --warn: #9A5B00; --warn-soft: #FFF2DA; --bad: #BF3434; --bad-soft: #FCE7E7;
  --shadow: 0 1px 2px rgba(29,27,54,.05), 0 6px 18px -8px rgba(29,27,54,.10);
  --shadow-lg: 0 20px 60px -20px rgba(29,27,54,.35);
  --r-xl: 20px; --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --c-indigo: #5B55E8; --c-blue: #3B8BEB; --c-teal: #14A39A; --c-green: #3E9B4F; --c-amber: #D99118; --c-rose: #E0567A; --c-violet: #9558E0; --c-slate: #6B7393;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) {
    color-scheme: dark;
    --bg: #0F1115; --surface: #171A20; --surface-2: #1E2229; --surface-3: #282D36;
    --line: #2A2F38; --line-strong: #3A404B;
    --ink: #E8EBF0; --ink-2: #C3C8D1; --muted: #8D95A3;
    --accent: #78A9F5; --accent-hover: #93BBF8; --accent-ink: #0C1424; --accent-soft: #1A2638; --accent-text: #9CC2FA;
    --lav: #5D7EAE; --sky: #6CC6D4; --sky-soft: #142D33;
    --earned: #78A9F5; --lost: #343A45; --pending-a: #233449; --pending-b: #1A2636;
    --ok: #5CC795; --ok-soft: #142A20; --warn: #E5B055; --warn-soft: #2D2413; --bad: #EF8080; --bad-soft: #331B1D;
    --c-indigo: #7E8CF0; --c-blue: #5E9EF0; --c-teal: #3EBFB2; --c-green: #63B86F; --c-amber: #E0A43A; --c-rose: #E87595; --c-violet: #A983E8; --c-slate: #8B95AE;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 24px 70px -20px rgba(0,0,0,.75);
  }
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #0F1115; --surface: #171A20; --surface-2: #1E2229; --surface-3: #282D36;
  --line: #2A2F38; --line-strong: #3A404B;
  --ink: #E8EBF0; --ink-2: #C3C8D1; --muted: #8D95A3;
  --accent: #78A9F5; --accent-hover: #93BBF8; --accent-ink: #0C1424; --accent-soft: #1A2638; --accent-text: #9CC2FA;
  --lav: #5D7EAE; --sky: #6CC6D4; --sky-soft: #142D33;
  --earned: #78A9F5; --lost: #343A45; --pending-a: #233449; --pending-b: #1A2636;
  --ok: #5CC795; --ok-soft: #142A20; --warn: #E5B055; --warn-soft: #2D2413; --bad: #EF8080; --bad-soft: #331B1D;
  --c-indigo: #7E8CF0; --c-blue: #5E9EF0; --c-teal: #3EBFB2; --c-green: #63B86F; --c-amber: #E0A43A; --c-rose: #E87595; --c-violet: #A983E8; --c-slate: #8B95AE;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 24px 70px -20px rgba(0,0,0,.75);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-wrap: break-word; line-break: auto;
}
html[lang="th"] body { line-height: 1.7; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
/* Help & Q&A: compact, responsive and consistent with existing cards. */
.help-h2{font-size:18px;margin:0 0 12px}.help-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.help-step{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-width:0}
.help-step span{flex:0 0 29px;width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);font-weight:750}
.help-step p{margin:0;font-size:13px;min-width:0}.help-faq{display:grid;gap:8px}.help-accordion{border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.help-accordion summary{font-weight:650;cursor:pointer}.help-accordion p{font-size:13px;color:var(--muted);margin:9px 0 0}
.help-question-list{display:grid;gap:10px;margin-top:17px}.help-question{border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;gap:7px;overflow-wrap:anywhere}
.help-answer{padding:11px;background:var(--accent-soft);border-radius:9px}.help-answer p{white-space:pre-wrap;margin:5px 0 0;font-size:13px}
@media(max-width:650px){.help-steps{grid-template-columns:1fr}}

/* Keep topbar controls anchored when save/status translations change width. */
.topbar .save-state { width:150px; min-width:150px; justify-content:flex-end; overflow:hidden; }
.topbar .seg { flex:0 0 115px; width:115px; justify-content:center; }
.topbar .seg button { flex:1; min-width:0; }
.topbar > .btn.icon, .topbar > a.btn.icon { flex:0 0 38px; width:38px; }
@media(max-width:900px){.topbar .save-state{width:18px;min-width:18px;justify-content:center}.topbar .seg{width:100px;flex-basis:100px}}

.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line);
  background: var(--surface); display: flex; flex-direction: column; gap: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 39px; height: 39px; border-radius: 13px; display: grid; place-items: center; flex: none; box-shadow: 0 4px 11px rgba(79,70,229,.19); overflow: hidden; }
.brand-mark svg { width: 100%; height: 100%; display: block; }
.brand-name { font-weight: 700; font-size: 19px; letter-spacing: -.045em; line-height: 1.12; white-space: nowrap; }
.brand-name-accent { color: var(--accent-text); }
.brand:hover .brand-mark { box-shadow: 0 6px 14px rgba(79,70,229,.24); }
.auth-card .brand-mark { width: 44px; height: 44px; border-radius: 15px; }
.auth-card .brand-name { font-size: 22px; }
.brand-tag { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2);
  text-decoration: none; font-weight: 500; font-size: 14.5px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item svg { flex: none; }
.side-foot { margin-top: auto; padding: 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.topbar .brand { display: none; padding: 0; }
.topbar-spacer { flex: 1; }
.save-state { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save-dot.busy { background: var(--warn); }
.page { padding: 8px 28px 48px; max-width: 1160px; width: 100%; margin: 0 auto; }
.bottomnav { display: none; }
@media(max-width:900px){.bottomnav{grid-template-columns: repeat(7,minmax(48px,1fr)) !important;}}

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { padding: 10px 16px; }
  .topbar .brand { display: flex; }
  .topbar .brand-tag { display: none; }
  .save-state .save-label { display: none; }
  .page { padding: 4px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bottomnav {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottomnav a {
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted);
    text-decoration: none; padding: 4px 2px; border-radius: 10px; line-height: 1.25; text-align: center;
  }
  .bottomnav a[aria-current="page"] { color: var(--accent-text); }
}

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px;
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; line-height: 1.4; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 7px; }
.btn.icon.sm { padding: 5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; padding: 4px 11px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.card.pad { padding: 20px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.6;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
.chip.sky { background: var(--sky-soft); color: var(--sky); }
.chip.outline { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grow { flex: 1; min-width: 0; }
.hide-sm { }
@media (max-width: 640px) { .hide-sm { display: none !important; } }

h1, h2, h3, h4 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 14px 0 22px; }
.page-head h1 { font-size: 28px; font-weight: 700; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.section { margin-top: 30px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 18px; font-weight: 650; }


/* Dashboard 2026: compact vertical upcoming list beside a real date-driven exam calendar. */
.dashboard-planning-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:10px;align-items:start}
.dashboard-planning-mini{display:grid;gap:10px;min-width:0}
.planning-card.card{padding:12px 14px;min-width:0;box-shadow:none}
.planning-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.planning-head h2{font-size:14px;line-height:1.35;margin:0}
.planning-mini .planning-head{margin-bottom:5px}
.planning-value{font-size:22px;font-weight:750;line-height:1.25;display:flex;align-items:baseline;flex-wrap:wrap;gap:5px}
.planning-value span{font-size:11px;color:var(--muted);font-weight:500}
.planning-range{height:6px;background:var(--surface-3);border-radius:8px;position:relative;margin:7px 0;overflow:hidden}
.planning-range>div{position:absolute;height:100%;border-radius:8px;background:var(--accent)}
.planning-link{font-size:12px;font-weight:600;text-decoration:none}
.planning-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.planning-actions .btn{font-size:11px;min-height:28px;padding:4px 7px;white-space:normal}
.study-list{display:grid;gap:6px}
.study-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:9px;border:1px solid var(--line);border-inline-start:3px solid var(--line-strong);color:var(--ink);text-decoration:none;min-width:0}
.study-row:hover{outline:1px solid var(--accent)}
.study-row.urgent{background:var(--bad-soft);border-inline-start-color:var(--bad)}
.study-row.soon{background:var(--warn-soft);border-inline-start-color:var(--warn)}
.study-row.normal{background:var(--surface-2);border-inline-start-color:var(--accent)}
.study-row.done{background:var(--ok-soft);border-inline-start-color:var(--ok)}
.study-row.review{background:var(--surface-2);border-inline-start-color:var(--warn)}
.study-copy{min-width:0;flex:1;display:grid;gap:2px}
.study-copy b{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.study-copy>span,.study-empty,.study-finished{font-size:11px;line-height:1.4;color:var(--ink-2)}
.study-badge{display:inline-block;flex:none;font-size:11px;font-weight:700;line-height:1.3;padding:4px 6px;border-radius:6px;white-space:normal;text-align:center}
.study-badge.urgent{background:var(--bad);color:var(--surface)}
.study-badge.soon,.study-badge.review{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.study-badge.done{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.study-badge.normal{background:var(--accent-soft);color:var(--accent-text)}
.study-finished{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.planning-more.btn{font-size:11px;min-height:28px;margin-top:5px;padding:3px 6px}
.exam-status-panel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px}
.exam-status-title{display:grid;gap:2px}
.exam-status-actions{display:flex;gap:10px;flex-wrap:wrap}
.exam-status-item{display:flex;align-items:center;gap:6px;font-size:12px}
@media(max-width:1050px){.dashboard-planning-grid{grid-template-columns:1fr}.dashboard-planning-mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.planning-card.card{padding:10px}.planning-head h2{font-size:13px}.planning-value{font-size:18px}.planning-actions .btn{padding:4px 5px}.study-row{padding:7px}.study-badge{max-width:38%}.dashboard-planning-grid,.dashboard-planning-mini{gap:8px}}
.overview-hub.card{margin-top:12px;padding:14px;background:var(--surface);box-shadow:none;border-color:var(--line-strong)}
.hub-kicker{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:10px}
.hub-kicker>span:first-child{display:flex;align-items:center;gap:6px;color:var(--accent-text);font-size:12px;font-weight:750;letter-spacing:.035em}
.overview-hub .dashboard-planning-grid{grid-template-columns:minmax(0,1fr) minmax(200px,.46fr);gap:12px}
.overview-hub .dashboard-planning-mini{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-items:stretch}
.focus-panel{min-width:0}
.focus-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:7px}
.focus-heading h2{font-size:16px;line-height:1.2;margin:0}
.focus-sub{font-size:11px;color:var(--muted);margin-top:3px}
.focus-list{display:grid;gap:5px}
.study-row.focus-row{--tone:var(--accent-text);--tone-bg:var(--accent-soft);display:grid;grid-template-columns:46px minmax(0,1fr) 13px;gap:9px;background:var(--surface-2);border:0;border-radius:8px;padding:7px 9px}
.study-row.focus-row.urgent{--tone:var(--bad);--tone-bg:var(--bad-soft)}
.study-row.focus-row.soon,.study-row.focus-row.review{--tone:var(--warn);--tone-bg:var(--warn-soft)}
.study-row.focus-row.done{--tone:var(--ok);--tone-bg:var(--ok-soft)}
.study-row.focus-row.featured{background:var(--tone-bg);box-shadow:inset 3px 0 var(--tone)}
.focus-day{background:var(--tone-bg);color:var(--tone);border-radius:6px;min-height:41px;display:grid;place-content:center;text-align:center}
.focus-day b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.focus-day small{font-size:10px;line-height:1.2;margin-top:3px}
.focus-row.featured .focus-day{background:var(--tone);color:var(--surface)}
.focus-row .study-copy{gap:1px}
.focus-row .study-copy b{font-size:13px}
.focus-row .study-copy .focus-action{color:var(--tone);font-weight:750;font-size:10px}
.focus-arrow{color:var(--tone);font-size:21px;line-height:1}
.focus-footer{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap;margin-top:5px}
.focus-complete{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ok)}
.focus-history{display:grid;gap:3px;font-size:11px;margin-top:6px}
.hub-mini{background:var(--surface-2);border-radius:8px;min-width:0;padding:9px;display:flex;flex-direction:column;gap:5px;align-self:start}
.hub-mini-label{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;font-weight:600;color:var(--ink-2);line-height:1.25}
.hub-mini-label>.ic{color:var(--accent-text)}
.hub-mini-value{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;letter-spacing:-.04em}
.hub-mini-value small{font-size:10px;font-weight:500;margin-left:4px;letter-spacing:0;color:var(--muted)}
.hub-mini-action{font:inherit;font-size:11px;line-height:1.4;font-weight:650;color:var(--accent-text);padding:4px 0;background:none;border:0;text-align:left;text-decoration:none;cursor:pointer;min-height:25px;margin-top:auto}
.hub-mini-action:hover{text-decoration:underline}

@media(min-width:1051px){.overview-hub .dashboard-planning-mini{grid-template-columns:1fr;gap:7px}.hub-mini{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px 8px}.hub-mini-label{grid-column:1/-1}.hub-mini-action{text-align:right}.hub-status{grid-column:1/-1}}

@media(max-width:640px){.overview-hub.card{padding:10px;margin-top:10px}.hub-mini{padding:8px;gap:4px}.hub-mini-value{font-size:18px}.focus-heading h2{font-size:15px}.study-row.focus-row{grid-template-columns:42px minmax(0,1fr) 10px;padding:6px;gap:6px}.focus-day{min-height:38px}.focus-row .study-copy b{font-size:12px}}
.dashboard-exam-layout { display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start; }

.dashboard-upcoming-list { list-style:none;padding:0;margin:0; }
.dashboard-upcoming-row { display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0; }
.dashboard-upcoming-row:first-child { padding-top:2px; }
.dashboard-upcoming-row:last-child { border-bottom:0;padding-bottom:2px; }
.dashboard-upcoming-row .date-pill { width:45px;padding:5px 2px;border-radius:11px; }
.dashboard-upcoming-row .upcoming-info { flex:1;min-width:0; }
.dashboard-upcoming-row .upcoming-course-title { font-size:13.5px;line-height:1.35;font-weight:680; }
.dashboard-upcoming-row .upcoming-meta { margin-top:4px;gap:4px 7px; }
.dashboard-upcoming-row .btn { flex:none;white-space:nowrap; }
.dashboard-calendar-head { display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px; }
.dashboard-calendar-heading { font-size:14px;font-weight:700; }
.dashboard-calendar-controls { display:flex;align-items:center;gap:6px; }
.dashboard-calendar-controls .btn { padding:4px 7px;min-width:28px; }
.dashboard-cal-grid { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px; }
.dashboard-cal-weekday { font-size:11px;color:var(--muted);font-weight:650;text-align:center;padding:7px 0; }
.dashboard-cal-cell { min-height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:12px;font-weight:550;position:relative; }
button.dashboard-cal-cell { cursor:pointer; }
.dashboard-cal-cell.has-exam { background:var(--accent-soft);color:var(--accent-text);font-weight:800; }
.dashboard-cal-cell.has-exam::after { content:'';position:absolute;bottom:3px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--accent); }
.dashboard-cal-cell.chosen { border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent); }
.dashboard-cal-cell.today { border-color:var(--line-strong); }
.dashboard-calendar-legend { font-size:12px;font-weight:650;color:var(--muted);margin:12px 0 4px; }
.dashboard-cal-event { display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);min-width:0; }
.dashboard-cal-event .date-pill { width:39px;padding:4px 0;border-radius:8px; }
.dashboard-cal-event .date-pill b { font-size:13px; }
.dashboard-cal-event-main { min-width:0;flex:1; }
.dashboard-cal-event-name { font-size:12.5px;font-weight:650;line-height:1.35;overflow-wrap:anywhere; }
.dashboard-cal-event-type { font-size:11px;color:var(--muted);margin-top:2px; }
.dashboard-calendar-note { margin-top:9px;font-size:11px;line-height:1.5;color:var(--muted); }
@media (max-width: 1050px) { .dashboard-exam-layout { grid-template-columns:1fr; } }
@media (max-width: 640px) { .dashboard-exam-layout { gap:12px; } .dashboard-upcoming-row { padding:10px 0;gap:9px; } .dashboard-upcoming-row .upcoming-course-title { font-size:13px; } .dashboard-exam-panel { padding:13px !important; } }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.req { color: var(--bad); margin-left: 2px; }
.input, .select, .textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface);
  font-size: 15px; transition: border-color .15s, box-shadow .15s; min-width: 0;
}
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.err { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.textarea { min-height: 76px; resize: vertical; }
.hint { font-size: 12.5px; color: var(--muted); }
.error-text { font-size: 12.5px; color: var(--bad); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; outline-offset: 2px; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.input-group { display: flex; align-items: stretch; }
.input-group .input { border-radius: 10px 0 0 10px; }
.input-group .addon { display: grid; place-items: center; padding: 0 12px; border: 1px solid var(--line-strong); border-left: 0; border-radius: 0 10px 10px 0; background: var(--surface-2); color: var(--muted); font-size: 14px; white-space: nowrap; }

/* ---------- metrics ---------- */
.metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1180px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.metric { padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.metric .m-label { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 5px; line-height: 1.35; }
.metric .m-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 6px; font-variant-numeric: tabular-nums; }
.metric .m-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.metric.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.metric.hero .m-label, .metric.hero .m-sub { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }

/* ---------- grade bar (signature element) ---------- */
.gbar { position: relative; }
.gbar-track { position: relative; display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.gbar.lg .gbar-track { height: 22px; border-radius: 8px; }
.gbar-seg { height: 100%; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.gbar-seg.earned { background: var(--earned); }
.gbar-seg.lost { background: var(--lost); }
.gbar-seg.pending { background: repeating-linear-gradient(-45deg, var(--pending-a) 0 6px, var(--pending-b) 6px 12px); }
.gbar-seg.unassigned { background: transparent; }
.gbar-ticks { position: absolute; inset: 0; pointer-events: none; }
.gbar-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; border-radius: 2px; }
.gbar-tick.target { opacity: 1; background: var(--ink); width: 2px; }
.gbar.lg .gbar-tick { opacity: .28; top: 0; bottom: 0; width: 1px; }
.gbar.lg .gbar-tick.target { opacity: 1; width: 2px; top: -5px; bottom: -5px; }
.gbar-labels { position: relative; height: 18px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.gbar-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-weight: 600; }
.gbar-labels span.target { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.earned { background: var(--earned); }
.legend i.lost { background: var(--lost); }
.legend i.pending { background: repeating-linear-gradient(-45deg, var(--pending-a) 0 3px, var(--pending-b) 3px 6px); border: 1px solid var(--pending-a); }
.legend i.unassigned { border: 1px dashed var(--line-strong); }

/* ---------- course cards ---------- */
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .course-grid { grid-template-columns: 1fr; } }
.ccard { position: relative; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.ccard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cc, var(--accent)); }
.ccard-top { display: flex; align-items: flex-start; gap: 12px; }
.ccard-name { font-weight: 650; font-size: 16px; line-height: 1.35; }
.ccard-meta { font-size: 12.5px; color: var(--muted); }
.grade-badge {
  flex: none; min-width: 52px; text-align: center; padding: 4px 8px 5px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); line-height: 1.15;
}
.grade-badge b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.grade-badge small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; white-space: nowrap; }
.grade-badge.confirmed { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.grade-badge.confirmed small { color: var(--ok); }
.grade-badge.calculated { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.grade-badge.calculated small { color: var(--accent-text); }
.grade-badge.estimated { border-style: dashed; border-color: var(--line-strong); background: transparent; }
.grade-badge.none b { color: var(--muted); }
.ccard-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ccard-stats div { min-width: 0; }
.ccard-stats .k { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.ccard-stats .v { font-weight: 650; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.ccard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--cc, var(--accent)); }

/* ---------- course detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; margin-top: 10px; }
.back:hover { color: var(--ink); }
.course-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 12px 0 18px; }
.course-head h1 { font-size: 26px; font-weight: 700; }
.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
@media (max-width: 720px) { .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sum-cell { background: var(--surface); padding: 14px 16px; min-width: 0; }
.sum-cell .k { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; line-height: 1.35; }
.sum-cell .k b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; flex: none; }
.sum-cell .v { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sum-cell .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.sum-cell .d { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
.banner svg { flex: none; margin-top: 2px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--sky-soft); color: var(--ink-2); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }

/* assessment list */
.alist { display: flex; flex-direction: column; }
.arow {
  display: grid; grid-template-columns: minmax(0, 2.2fr) 74px minmax(150px, 1.25fr) 86px minmax(110px, 1fr) 72px;
  gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line);
}
.arow.head { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 10px; padding-bottom: 8px; }
.arow.cat { background: var(--surface-2); padding-top: 10px; padding-bottom: 10px; }
.arow.child { padding-left: 34px; }
.a-name { font-weight: 600; line-height: 1.35; }
.a-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); margin-top: 3px; align-items: center; }
.score-in { display: flex; align-items: center; gap: 6px; }
.score-in .input { width: 76px; padding: 6px 9px; font-size: 14.5px; text-align: right; font-variant-numeric: tabular-nums; }
.score-in span { color: var(--muted); white-space: nowrap; font-size: 14px; }
.contrib b { font-variant-numeric: tabular-nums; font-size: 15px; }
.contrib small { color: var(--muted); font-size: 12.5px; }
.minibar { height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 5px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--earned); border-radius: 4px; }
.r-actions { display: flex; justify-content: flex-end; gap: 2px; }
.cell-label { display: none; }
@media (max-width: 820px) {
  .arow { grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 14px 14px; }
  .arow.head { display: none; }
  .arow .a-main { grid-column: 1 / -1; display: flex; gap: 10px; align-items: flex-start; }
  .arow .r-actions { position: static; }
  .arow.child { padding-left: 24px; }
  .cell-label { display: block; font-size: 11.5px; color: var(--muted); }
}
.status-btn { border: 0; cursor: pointer; }
@media (max-width: 560px) {
  .arow:not(.head):not(.cat) { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "main main act" "w ctr sc"; gap: 6px 12px; padding: 11px 12px; align-items: end; }
  .arow .a-main { grid-area: main; } .arow .r-actions { grid-area: act; align-self: start; margin: -4px -6px 0 0; }
  .arow .c-w { grid-area: w; } .arow .contrib { grid-area: ctr; } .arow .c-s { grid-area: sc; }
  .arow .c-p { display: none; }
  .arow.child:not(.cat) { padding-left: 22px; }
  .arow .score-in .input { width: 62px; padding: 5px 7px; }
  .arow .cell-label { font-size: 11px; margin-bottom: 1px; }
  .arow .contrib b { font-size: 14px; }
  .alist-actions { width: 100%; }
  .alist-actions .btn { flex: 1 1 auto; justify-content: center; }
  .summary-grid { display: flex; flex-direction: column; }
  .sum-cell { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 13px; }
  .sum-cell .v { font-size: 17px; margin-top: 0; white-space: nowrap; }
  .sum-cell .v small { font-size: 12.5px; }
  .sum-cell .d { display: none; }
}

/* ---------- simulator ---------- */
.sim-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
@media (max-width: 720px) { .sim-head { grid-template-columns: 1fr; } }
.verdict { padding: 18px 20px; border-radius: var(--r-lg); background: var(--accent-soft); color: var(--ink); }
.verdict.impossible { background: var(--bad-soft); }
.verdict.secured { background: var(--ok-soft); }
.verdict-main { font-size: 19px; font-weight: 650; line-height: 1.45; }
.verdict-main .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.verdict-sub { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.ladder { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.rung { padding: 9px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.rung[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.rung b { font-size: 17px; display: block; }
.rung span { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); display: block; line-height: 1.35; }
.rung.impossible span { color: var(--bad); }
.rung.secured span { color: var(--ok); }
.slider-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 120px; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.slider-row:first-child { border-top: 0; }
@media (max-width: 640px) { .slider-row { grid-template-columns: 1fr auto; } .slider-row input[type=range] { grid-column: 1 / -1; grid-row: 2; } }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.sim-result { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .sim-result { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sim-result div { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.sim-result .k { font-size: 12px; color: var(--muted); line-height: 1.35; }
.sim-result .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .sim-result { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
  .sim-result > div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-radius: 0; padding: 9px 13px; }
  .sim-result > div > * { margin: 0 !important; }
  .sim-result .v { font-size: 17px; white-space: nowrap; }
  .sim-result .tiny { display: none; }
}

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--r-md); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .input, .tbl .select { padding: 6px 9px; font-size: 14px; }
.tbl tr.sub td { background: var(--surface-2); font-weight: 600; }

/* ---------- years ---------- */
.year { padding: 0; overflow: hidden; }
.year-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; flex-wrap: wrap; }
.year-head h3 { font-size: 18px; font-weight: 650; }
.sem { border-top: 1px solid var(--line); padding: 14px 18px; }
.sem-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sem-head h4 { font-size: 15.5px; font-weight: 650; }
.sem-courses { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.sem-course { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
.sem-course a { color: var(--ink); text-decoration: none; font-weight: 550; }
.sem-course a:hover { color: var(--accent-text); }
.sem-course .select { width: auto; max-width: 200px; padding: 4px 8px; font-size: 13px; }
.stat-inline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stat-inline b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- chart ---------- */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); }
.chart-tip { font-size: 13px; color: var(--ink-2); min-height: 22px; margin-top: 4px; }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(20, 19, 38, .42); display: flex; align-items: center; justify-content: center;
  padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  animation: fade .16s ease-out;
}
.modal {
  width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg); border: 1px solid var(--line); animation: rise .2s cubic-bezier(.2,.8,.2,1);
}
.modal.wide { max-width: 720px; }

}
@media (max-width: 560px) {

}
.thumb-badge { position: absolute; left: 5px; bottom: 5px; background: rgba(0,0,0,.66); color: #fff; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
@media (max-width: 520px) { .scan-score .input { width: 54px; } .scan-row { gap: 8px; padding: 8px 12px; } }

.cat-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; max-height: 300px; overflow-y: auto; }
.cat-opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-top: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.cat-opt:first-child { border-top: 0; }
.cat-opt:hover, .cat-opt:focus-visible { background: var(--accent-soft); }
.cat-code { font-size: 13px; color: var(--muted); flex: none; }
.cat-name { font-weight: 600; font-size: 14px; }

/* Keep Midterm and Final on their own explicit rows on every screen. */
.exam-l { display: block; }
.exam-lines { display: flex; flex-direction: column; align-items: stretch; gap: 5px; width: 100%; }
.exam-entry { display: flex; align-items: flex-start; gap: 7px; line-height: 1.55; min-width: 0; }
.exam-entry-icon { display: inline-flex; flex: none; margin-top: 2px; color: var(--accent-text); }
.exam-entry-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.exam-detail { margin-top: 8px; color: var(--ink-2); }
.exam-detail .exam-lines { gap: 6px; }
.exam-detail-note { display: block; margin-top: 5px; }

.chip.course-kind-chip { font-size: 10.5px; font-weight: 550; line-height: 1.4; white-space: nowrap; padding: 2px 7px; }
.chip.kind-required { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.kind-gened { background: var(--sky-soft); color: var(--sky); }
.chip.kind-elective { background: var(--warn-soft); color: var(--warn); }
.credit-row { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.credit-row:first-of-type { border-top: 0; padding-top: 0; }

@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) .metric.hero { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--ink); }
  :root:not([data-mode="light"]) .metric.hero .m-label, :root:not([data-mode="light"]) .metric.hero .m-sub { color: var(--ink-2); }
  :root:not([data-mode="light"]) .metric.hero .m-value { color: var(--accent-text); }
}
:root[data-mode="dark"] .metric.hero { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--ink); }
:root[data-mode="dark"] .metric.hero .m-label, :root[data-mode="dark"] .metric.hero .m-sub { color: var(--ink-2); }
:root[data-mode="dark"] .metric.hero .m-value { color: var(--accent-text); }

.grade-badge.confirmed.neutral { background: var(--surface-2); color: var(--muted); }
.grade-badge.confirmed.neutral small { color: var(--muted); }

/* drag to reorder */
.sortable { position: relative; }
.sort-item { position: relative; display: flex; min-width: 0; }
.sort-item > .ccard { flex: 1; min-width: 0; }
.sort-item.dragging { z-index: 20; }
.sort-item.dragging > .ccard { box-shadow: var(--shadow-lg); transform: scale(1.02); transition: transform 160ms ease, box-shadow 160ms ease; }
.sort-item > .ccard { transition: transform 160ms ease, box-shadow 160ms ease; }
.drag-handle { touch-action: none; cursor: grab; color: var(--muted); margin-left: -6px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.drag-handle:hover { color: var(--ink); }
/* Highlight the intended drop slot without triggering a React re-render while dragging. */
.sort-item.dragging { z-index: 10; pointer-events: none; }
.sort-item.sort-drop-before > .ccard,
.sort-item.sort-drop-after > .ccard { outline: 2px dashed var(--accent); outline-offset: 3px; }
.sort-item.sort-drop-before::after, .sort-item.sort-drop-after::after {
  content: ''; position: absolute; left: 8px; right: 8px; height: 3px;
  border-radius: 3px; background: var(--accent); pointer-events: none; z-index: 11;
}
.sort-item.sort-drop-before::after { top: -6px; }
.sort-item.sort-drop-after::after { bottom: -6px; }
body.is-sorting, body.is-sorting * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.goal-insight{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);margin-top:10px}
.goal-insight.compact{padding:8px 10px;font-size:13px}
.goal-gap{display:flex;flex-direction:column;gap:3px}
.goal-gap b{font-size:14px;color:var(--ink-2)}
.exam-preview{margin-top:8px;display:block;font-size:12px;color:var(--ink-2)}
.auth-privacy{font-size:12px;line-height:1.5;color:var(--muted)}


/* Inline grade goal picker: selectable from the course card, usable by touch and keyboard. */
.goal-pick { position: relative; flex: 0 1 auto; min-width: 0; }
.goal-pick-button { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--surface-2); color: var(--ink-2); font: inherit; font-weight: 650; line-height: 1.3; cursor: pointer; }
.goal-pick-button:hover, .goal-pick-button[aria-expanded="true"] { color: var(--accent-text); border-color: var(--accent); background: var(--accent-soft); }
.goal-pick-button:focus-visible, .goal-pick-option:focus-visible, .gbar-grade-option:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.goal-pick-button .goal-pick-edit { opacity: .75; }
.goal-pick-panel { position: absolute; bottom: calc(100% + 7px); left: 0; width: min(300px, calc(100vw - 42px)); padding: 12px; z-index: 35; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 15px; box-shadow: var(--shadow-lg); }
.goal-pick-heading { font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 9px; }
.goal-pick-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.goal-pick-option { display: grid; place-items: center; min-height: 43px; padding: 6px 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; font: inherit; color: var(--ink); cursor: pointer; }
.goal-pick-option b { line-height: 1.2; font-size: 14px; }
.goal-pick-option small { line-height: 1.3; font-size: 10px; color: var(--muted); }
.goal-pick-option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.goal-pick-option:hover { border-color: var(--accent); }
.goal-pick-clear { width: 100%; font: inherit; cursor: pointer; text-align: center; font-size: 12px; min-height: 29px; border: 0; background: transparent; color: var(--muted); margin-top: 5px; }
.goal-pick-clear:hover { color: var(--ink); }
.ccard:has(.goal-pick-panel) { overflow: visible; z-index: 5; }
.ccard-foot { flex-wrap: wrap; }
.gbar-labels button.gbar-grade-option { position: absolute; transform: translateX(-50%); margin: 0; padding: 2px 3px; min-width: 23px; min-height: 24px; border: 1px solid transparent; border-radius: 7px; font: inherit; font-weight: 650; font-size: 11.5px; line-height: 1.1; background: transparent; color: var(--muted); cursor: pointer; touch-action: manipulation; }
.gbar-labels button.gbar-grade-option:hover, .gbar-labels button.gbar-grade-option[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); z-index: 2; }
.gbar.lg:has(.gbar-grade-option) .gbar-labels { height: 28px; }
.goal-bar-hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
@media (max-width: 480px) { .goal-pick-panel { left: 0; width: min(276px, calc(100vw - 42px)); } .goal-pick-button { font-size: 12px; } }

/* Class statistics are provisional reference evidence, never grading cutoffs. */
.courseville-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin: 14px 0; }
.courseville-metric { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); }
.courseville-metric strong { font-size: 21px; font-weight: 720; font-variant-numeric: tabular-nums; }
.courseville-histogram { display: grid; gap: 7px; }
.courseville-row { display: grid; align-items: center; grid-template-columns: 76px minmax(0, 1fr) 32px; gap: 10px; }
.courseville-bar-track { height: 13px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.courseville-bar { display: block; min-height: 13px; height: 100%; background: var(--accent); border-radius: 5px; }
.courseville-count { text-align: right; font-variant-numeric: tabular-nums; }
.courseville-caution { margin-top: 14px; padding: 11px 13px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); line-height: 1.7; }
@media (max-width: 620px) { .courseville-metrics { grid-template-columns: repeat(2, minmax(0,1fr)); } .courseville-row { grid-template-columns: 64px minmax(0,1fr) 26px; gap: 6px; } }


/* Responsive rhythm: compact sections, consistent alignment across all course cards. */
.page-head { margin: 10px 0 16px; gap: 12px; }
.section { margin-top: 22px; }
.section-head { margin-bottom: 10px; }
.card.pad { padding: 16px 18px; }
.stack { gap: 12px; }
.course-grid { gap: 12px; align-items: stretch; }
.ccard { padding: 15px 16px 14px; gap: 9px; min-height: 0; }
.ccard-top { min-width: 0; }
.ccard-performance { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.ccard-details { display: flex; flex-direction: column; gap: 7px; align-items: stretch; min-width: 0; }
.ccard-details .goal-insight { margin-top: 0; }
.ccard-details .exam-preview { margin-top: 0; }
.ccard-foot { margin-top: auto; min-width: 0; padding-top: 8px; border-top: 1px solid var(--line); }
.ccard-foot > .row { min-width: 0; }
.ccard-foot > .btn { flex: none; }
/* Nine shared tracks: title, metadata, bar, progress, warnings, forecast, goal, exam, footer.
   The sortable wrapper must also be a subgrid so dragging retains the same card geometry. */
.ccard-slot { min-width: 0; }
.ccard-slot:empty { display: none; }
.ccard-top > .grow { min-width: 0; overflow-wrap: anywhere; }
.ccard-foot { align-self: stretch; }
@supports (grid-template-rows: subgrid) {
  @media (min-width: 641px) {
    .course-grid > .ccard,
    .course-grid > .sort-item { grid-row: span 9; }
    .course-grid > .sort-item { display: grid; grid-template-rows: subgrid; }
    .course-grid > .ccard,
    .course-grid > .sort-item > .ccard {
      display: grid;
      grid-template-rows: subgrid;
      row-gap: 9px;
      align-content: stretch;
      min-width: 0;
      width: 100%;
    }
    .course-grid > .sort-item > .ccard { grid-row: 1 / -1; }
    .course-grid .ccard-top {
      display: grid;
      grid-row: span 2;
      grid-template-rows: subgrid;
      grid-template-columns: minmax(0,1fr) auto;
      column-gap: 12px;
      row-gap: 3px;
      align-items: start;
    }
    .course-grid .ccard-top > .grow {
      display: grid;
      grid-column: 1;
      grid-row: 1 / -1;
      grid-template-rows: subgrid;
      align-items: start;
    }
    .course-grid .ccard-top > .grade-badge {
      grid-column: 2;
      grid-row: 1 / -1;
      align-self: start;
    }
    .course-grid .ccard-slot:empty { display: block; }
    /* Fill the entire shared footer track, even when a course has no goal picker.
       Bottom-aligning an intrinsically shorter footer offsets its top border. */
    .course-grid .ccard-foot {
      margin-top: 0;
      align-self: stretch;
      align-items: center;
    }
    .course-grid .ccard-foot > .btn,
    .course-grid .ccard-foot .goal-pick-button {
      min-height: 34px;
    }
    .course-grid .ccard-slot { align-self: start; }
    .course-grid .ccard-top { grid-row: 1 / 3; }
    .course-grid .ccard-bar-slot { grid-row: 3; }
    .course-grid .ccard-progress-slot { grid-row: 4; }
    .course-grid .ccard-warning-slot { grid-row: 5; }
    .course-grid .ccard-forecast-slot { grid-row: 6; }
    .course-grid .ccard-goal-slot { grid-row: 7; }
    .course-grid .ccard-exam-slot { grid-row: 8; }
    .course-grid .ccard-foot { grid-row: 9; }
  }
}
@media (max-width: 640px) {
  .page-head { margin: 8px 0 12px; }
  .section { margin-top: 18px; }
  .card.pad { padding: 14px; }
  .ccard { padding: 14px 15px 13px; }
  .course-grid { gap: 10px; }
  .ccard-foot { flex-wrap: nowrap; }
}

/* Every repeated control and stat value aligns, even with longer Thai labels. */
.ccard-stats > div { display: flex; flex-direction: column; }
.ccard-stats .v { margin-top: auto; }
.ccard-foot { flex-wrap: nowrap; }
.ccard-foot > .row { flex: 1 1 auto; }
.ccard-foot .goal-pick { flex: 1 1 auto; min-width: 0; }
.ccard-foot .goal-pick-button { width: 100%; justify-content: flex-start; min-width: 0; }
.goal-pick-label { min-width: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.goal-pick-button > svg, .goal-pick-edit { flex: none; }
.goal-pick-edit { margin-left: auto; }
.metric { display: flex; flex-direction: column; }
.metric .m-label { min-height: 34px; }
@media (max-width: 360px) {
  .ccard-foot { gap: 5px; }
  .ccard-foot .goal-pick-button { padding: 5px 7px; gap: 4px; }
}

/* ----- community feedback ----- */
.feedback-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.feedback-list { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); align-items:start; gap:14px; }
.feedback-post { min-width:0; display:flex; flex-direction:column; gap:12px; }
.feedback-post p { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.feedback-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }
.feedback-status { padding:4px 10px; font-size:12px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--surface-2); }
.feedback-status.done { color:var(--ok); border-color:var(--ok); background:var(--ok-soft); }
.feedback-images { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.feedback-images a { display:block; aspect-ratio:4/3; border-radius:10px; border:1px solid var(--line); overflow:hidden; background:var(--surface-2); }
.feedback-images img { width:100%; height:100%; object-fit:cover; }
.feedback-reactions { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.feedback-react { border:1px solid var(--line); border-radius:999px; background:var(--surface); padding:6px 11px; display:flex; gap:5px; align-items:center; cursor:pointer; font-size:13px; }
.feedback-react:hover,.feedback-react.active { border-color:var(--accent); background:var(--accent-soft); }
.feedback-form { display:grid; gap:12px; }
.feedback-note { color:var(--muted); font-size:12.5px; line-height:1.55; }
.feedback-form textarea { min-height:112px; resize:vertical; }
.feedback-file-thumbs { display:flex; flex-wrap:wrap; gap:8px; }
.feedback-file-thumbs img { width:72px; height:72px; object-fit:cover; border:1px solid var(--line); border-radius:9px; }
.feedback-pending { color:var(--muted); font-size:13px; }
@media (max-width:720px) { .feedback-list{grid-template-columns:1fr;} .feedback-head { align-items:flex-start; } }

/* course search suggestions */
.cs-box { position: relative; width: 100%; max-width: 340px; }
.cs-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 14px; box-shadow: var(--shadow-lg); max-height: min(420px, 60vh); overflow-y: auto; padding: 6px; animation: rise .14s ease-out; }
.cs-head { font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 8px 10px 4px; }
.cs-opt { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.cs-opt.on { background: var(--accent-soft); }
.cs-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
.cs-text b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.cs-act { font-size: 12.5px; font-weight: 600; color: var(--accent-text); flex: none; }
.cs-plus { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-text); flex: none; }

@media (max-width: 560px) { .cs-box { max-width: none; } .filters { flex-direction: column; align-items: stretch; } .filters .select { width: 100% !important; } }

/* study plan: major / year / term pickers */
.plan-steps { display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.plan-step { display: flex; flex-direction: column; gap: 8px; }
.pick-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: 14px; font-weight: 500; cursor: pointer; line-height: 1.3; transition: background .15s, border-color .15s, color .15s; }
.pick-chip:hover { border-color: var(--accent); }
.pick-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.major-groups { display: flex; flex-direction: column; gap: 10px; }
.major-group { display: flex; flex-direction: column; gap: 6px; }
.major-group-label { font-size: 12px; font-weight: 600; color: var(--muted); }

/* audit fixes: readable rows on phones */
.sem-head h4 { flex: 1 1 auto; min-width: 72px; white-space: nowrap; }
.sem-course > a.grow { flex: 1 1 170px; min-width: 150px; }
.tbl .input { min-width: 64px; }
.tbl td:nth-child(2) .input[aria-label] { min-width: 72px; }
.tbl input.input:not([inputmode]) { min-width: 120px; }
@media (max-width: 560px) { .sem-head .stat-inline { flex-basis: 100%; } }

/* Per-course section selection is compact and independent per subject. */
.plan-course-sec { margin-top: 8px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.plan-course-sec .select, .plan-course-sec .input { padding: 6px 10px; min-height: 36px; font-size: 13px; }
.plan-course-sec .tiny { flex-basis: 100%; }

/* study-plan picker */
.planner { display: flex; flex-direction: column; gap: 18px; }
.planner-step { display: flex; flex-direction: column; gap: 10px; }
.planner-label { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14.5px; color: var(--ink); }
.planner-num { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent-text); flex: none; }
.planner-sublabel { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.prog-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.prog-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 14px; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; min-width: 0; }
.prog-tile:hover { border-color: var(--line-strong); }
.prog-tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.prog-icon { font-size: 20px; line-height: 1.2; }
.prog-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
.prog-sub { font-size: 12px; color: var(--muted); }
.major-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.when-row { display: flex; flex-wrap: wrap; gap: 10px; }
.seg-pick { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.seg-pick button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.seg-pick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg-pick button:disabled { color: var(--muted); opacity: .45; cursor: not-allowed; }
.planner-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px;
  background: var(--ok-soft); color: var(--ok); font-size: 13.5px; font-weight: 600; }
.planner-summary b { margin-left: auto; }
.planner-source { font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) {
  .prog-tiles { grid-template-columns: 1fr; }
  .prog-tile { flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; }

 <div class="list">${[['Quiz 3','9','10','new'],['Quiz 4','8.5','10','new'],['Reading 2','—','10','chk'],['Presentation','21','25','dup']].map(r=>`<div class="pad row small"><span class="sp">${r[0]}</span><span class="n">${r[1]}/${r[2]}</span><span class="st ${r[3]}">${{new:L('ใหม่','New'),chk:L('ต้องตรวจ','Check'),dup:L('ซ้ำ','Duplicate')}[r[3]]}</span></div>`).join('')}<div class="pad tiny">+ 8 ${L('รายการ','more')}</div></div>

function settings(){const R=[['appearance','sliders',L('หน้าตาแอป','Appearance'),L('ธีมมหาวิทยาลัย โหมดสว่าง/มืด สี','University theme, light/dark, colours')],['profile','user',L('สังกัดของฉัน','Academic profile'),L('มหาวิทยาลัย คณะ หลักสูตร','University, faculty, program')],['connect','link',L('AI ที่เชื่อมต่อ','Connected AI'),L('ChatGPT, Claude และ AI อื่น','ChatGPT, Claude and others')],['history','undo',L('ประวัติการนำเข้า','Import history'),L('ย้อนกลับการนำเข้าทั้งชุด','Undo whole imports')]];
 const A=[['coverage','db',L('ความครอบคลุมข้อมูล','Data coverage')],['admin','db',L('จัดการข้อมูลหลักสูตร','Curriculum data')]];

 return head(L('ตั้งค่า','Settings'),'test@example.com')+`<div class="card list">${R.map(row).join('')}</div><div class="sec">${L('สำหรับผู้ดูแลข้อมูล','For data maintainers')}</div><div class="card list">${A.map(row).join('')}</div>`}

 ['link',L('เชื่อม ChatGPT หรือ Claude','Connect ChatGPT or Claude'),L('ตั้งค่า › AI ที่เชื่อมต่อ','Settings › Connected AI'),'go:connect'],

function cmdMenu(){const q=S.cmdQ.trim().toLowerCase();const items=CMDS().filter(x=>!q||(x[1]+' '+x[2]).toLowerCase().includes(q)).slice(0,9);
 return `<div class="scrim" data-act="closeSheet" style="align-items:flex-start;padding-top:10vh"><div class="sheet cmdsheet" role="dialog" aria-modal="true" aria-label="Command menu"><div class="row" style="flex-wrap:nowrap;border-bottom:1px solid var(--line);padding:4px 4px 10px">${I('search')}<input id="cmdIn" class="f" style="border:0;min-height:36px;padding:4px" value="${esc(S.cmdQ)}" placeholder="${L('ลองพิมพ์ “เสียง”, “บัญชี”, “ย้อน”','Try “voice”, “accounting”, “undo”')}" autocomplete="off"></div>
 <div class="list">${items.map(x=>`<button class="todo" data-act="cmdRun" data-v="${x[3]}" style="display:flex;gap:12px;align-items:center;padding:10px 8px;width:100%;border:0;background:none;text-align:start;cursor:pointer">${I(x[0])}<span class="sp"><b style="display:block;font-weight:600;font-size:14.5px">${esc(x[1])}</b>${x[2]?`<span class="tiny">${esc(x[2])}</span>`:''}</span></button>`).join('')||`<div class="empty">${L('ไม่พบ','No match')}</div>`}</div><div class="tiny" style="padding:8px 4px 0">${L('ทุกฟีเจอร์ค้นได้จากที่นี่ แม้จะไม่อยู่ในเมนู','Every feature is searchable here, even if it is not in the menu')}</div></div></div>`}

const SCREENS={overview,courses,course,upload,review,conflict,calendar,more,gpa,simulator:gpa,degree,planner,catalog,history,profile,appearance,coverage,admin,map,connect,settings,feedback,help};

/* ---------- render ---------- */
let toastT;
function toast(msg,undo){clearTimeout(toastT);$('#layer').querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=`<span>${msg}</span>${undo?`<button data-act="${undo}">${L('ย้อนกลับ','Undo')}</button>`:''}`;$('#layer').append(d);toastT=setTimeout(()=>d.remove(),5000)}
function sheet(html){$('#layer').innerHTML=`<div class="scrim" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function applyRoot(){const r=document.documentElement;r.dataset.inst=S.theme;r.dataset.mode=S.mode;r.dataset.font=S.font;r.lang=S.lang;
 if(S.accentCustom){r.style.setProperty('--accent',S.accentCustom);r.style.setProperty('--accent-soft',S.accentCustom+'22')}else{r.style.removeProperty('--accent');r.style.removeProperty('--accent-soft')}
 $('#pTheme').value=S.theme;$('#pMode').value=S.mode;$('#pLang').value=S.lang;$('#pFont').value=S.font}
function render(){applyRoot();navHTML();$('#main').innerHTML=(SETSUB.includes(S.route)?`<button class="btn ghost sm" data-go="settings">← ${L('ตั้งค่า','Settings')}</button>`:'')+(SCREENS[S.route]||overview)();
 $('#aiLayer').innerHTML=S.aiOpen?`<div class="aiscrim" data-act="aiClose"></div><aside class="aidrawer" role="dialog" aria-modal="true" aria-label="GradeSpace AI"><div class="aihead">${I('spark')}<b class="sp">GradeSpace AI</b>${S.aiStarted?`<button class="btn ghost sm" data-act="aiReset">${L('แชทใหม่','New chat')}</button>`:''}<button class="btn ghost icon" data-act="aiClose" aria-label="${L('ปิด','Close')}">${I('x')}</button></div><div class="aibody">${ai()}</div></aside>`:'';const cr=$('#cr');if(cr)cr.textContent=contrast()}

/* ---------- voice simulation ---------- */
let vTimer;
function vTick(){clearInterval(vTimer);vTimer=setInterval(()=>{if(S.voice.st!=='rec')return;S.voice.t++;if(S.aiOpen)render()},1000)}
function pushChat(m){S.chat.push(m);render();const c=$('.chat');if(c)c.lastElementChild?.scrollIntoView({block:'end',behavior:'smooth'})}
function analyzeFlow(text){S.chat=S.chat.filter(m=>m.k!=='transcript');S.chat.push({k:'u',text,audio:16});const a={k:'analyzing',step:0};pushChat(a);
 let i=0;const t=setInterval(()=>{a.step=++i;render();if(i>=3){clearInterval(t);S.chat=S.chat.filter(m=>m!==a);pushChat({k:'clarify'})}},700)}
function finishVoice(){S.review={title:L('จากเสียง · 2 วิชา','From voice · 2 courses'),src:'voice',rows:mkReview('voice')};pushChat({k:'proposal',n:4,src:L('ข้อความเสียง 16 วินาที','a 16-second voice message'),sum:L('Experiential English I: Quiz 1 (แก้จาก 8 → 9), Quiz 2, Presentation (ซ้ำ) · Principles of Accounting: Midterm 68.5','Experiential English I: Quiz 1 (8 → 9), Quiz 2, Presentation (duplicate) · Principles of Accounting: Midterm 68.5')})}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();$('#layer').innerHTML='';go(g.dataset.go);return}
 const sh=e.target.closest('[data-sheet]');if(sh){sheet(sheetAdd());return}
 const cc=e.target.closest('[data-course]');const dt=e.target.closest('[data-detail]');
 if(dt){S.openCourse=dt.dataset.detail;go('course');return}
 const el=e.target.closest('[data-act]');
 if(!el){return}
 const a=el.dataset.act,v=el.dataset.v,i=+el.dataset.i;
 const R=S.review?.rows;const row=R?R.find(r=>r.id===i):null;
 switch(a){
 case 'cmdOpen':S.cmdQ='';$('#layer').innerHTML=cmdMenu();$('#cmdIn').focus();break;
 case 'cmdRun':{$('#layer').innerHTML='';const [k,x]=v.split(':');if(k==='go')go(x);else if(k==='course'){S.openCourse=x;go('course')}else if(x==='vStart'){S.aiStarted=true;S.seen.ai=1;S.aiOpen=true;S.voice={st:'rec',t:0};render();vTick()}break}
 case 'wnShow':S.whatsNew=true;go('overview');break;
 case 'wnClose':S.whatsNew=false;render();break;
 case 'aiClose':if(el.classList.contains('aiscrim')&&e.target!==el)break;S.aiOpen=false;render();break;
 case 'lang':S.lang=v;render();break;
 case 'modeToggle':{const dark=S.mode==='dark'||(S.mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);S.mode=dark?'light':'dark';render();break}
 case 'closeSheet':if(e.target===el)$('#layer').innerHTML='';break;
 case 'aiStart':S.aiStarted=true;render();break;
 case 'aiReset':S.chat=[];S.voice={st:'idle',t:0};render();break;
 case 'prompt':S.aiStarted=true;pushChat({k:'u',text:v});setTimeout(()=>pushChat({k:'a',html:v.includes('9')?L('เข้าใจว่า <b>Experiential English I · Quiz 1 = 9/10</b> — เตรียมรายการให้ตรวจแล้ว','Understood <b>Experiential English I · Quiz 1 = 9/10</b> — ready to review'):L('จาก Grade Engine: Economics I ต้องได้ Final อย่างน้อย <b class="n">22.78/35</b> เพื่อ A (เป้าหมายที่คุณตั้ง) · ข้อเท็จจริง: สะสม 52.45/60 · คาดการณ์: 85.22%','From the grade engine: Economics I needs <b class="n">22.78/35</b> on the final for your A target · Fact: 52.45/60 collected · Projection: 85.22%')}),600);break;
 case 'send':{const t=$('#cin')?.value.trim();if(!t)return;S.aiStarted=true;pushChat({k:'u',text:t});setTimeout(()=>pushChat({k:'a',text:L('(ต้นแบบ) ข้อความนี้จะถูกส่งเข้า pipeline เดียวกับเสียงและภาพ แล้วสร้างรายการให้ตรวจ','(Prototype) This text goes through the same pipeline as voice and images, producing a list to review')}),500);break}
 case 'vStart':case 'demoVoice':S.aiStarted=true;S.voice={st:'rec',t:0};if(S.route!=='ai')go('ai');else render();vTick();toast(L('จำลอง: ขอสิทธิ์ไมโครโฟนตอนกดครั้งแรกเท่านั้น','Simulated: mic permission is requested only on first tap'));break;
 case 'vPause':S.voice.st='paused';render();break;

 case 'vPlay':toast(L('▶ เล่นเสียงที่อัด (จำลอง)','▶ Playing recording (simulated)'));break;

 case 'vStop':{clearInterval(vTimer);S.voice={st:'idle',t:0};const tr={k:'transcribing'};pushChat(tr);setTimeout(()=>{S.chat=S.chat.filter(m=>m!==tr);pushChat({k:'transcript',text:SAMPLE_SPEECH})},1400);break}
 case 'vAnalyze':analyzeFlow($('#tEdit')?.value||SAMPLE_SPEECH);break;

 case 'demoImg':S.aiStarted=true;S.review={title:'Experiential English I · 10 '+L('ภาพ','images'),src:'img',rows:mkReview('img')};if(S.aiOpen){pushChat({k:'u',text:L('ทั้งหมดนี้เป็นคะแนนวิชา Experiential English I','These are all Experiential English I scores'),files:Array.from({length:10},(_,k)=>'IMG_'+(2040+k))});setTimeout(()=>pushChat({k:'proposal',n:30,src:L('10 ภาพ','10 images'),sum:L('ใหม่ 19 · แก้ไข 4 · ต้องตรวจ 2 · ซ้ำ 2 · เกินเต็ม 1','19 new · 4 updates · 2 to check · 2 duplicates · 1 over max')}),900)}else go('review');break;
 case 'demoVoiceReview':S.clar='80';S.review={title:L('จากเสียง · 2 วิชา','From voice · 2 courses'),src:'voice',rows:mkReview('voice')};render();break;
 case 'revF':S.reviewFilter=v;render();break;
 case 'revSkip':row.skip=!row.skip;render();break;

 case 'closeSheetBtn':$('#layer').innerHTML='';render();break;
 case 'revCancel':S.review=null;go('overview');toast(L('ยกเลิกการนำเข้า ไม่มีข้อมูลถูกเปลี่ยน','Import cancelled · nothing changed'));break;
 case 'revSave':{const n=R.filter(r=>!r.skip&&r.st!=='chk'&&r.st!=='bad').length;const h={id:'h'+Date.now(),when:L('เมื่อสักครู่','just now'),src:S.review.src,n,course:S.review.title,undone:false};S.history.unshift(h);S.lastH=h.id;S.review=null;go('history');toast(L(`บันทึก ${n} รายการแล้ว`,`Saved ${n} items`),'undoLast');break}
 case 'undoLast':case 'undoH':{const h=S.history.find(x=>x.id===(a==='undoLast'?S.lastH:el.dataset.i));if(h){h.undone=true;render();toast(L('ย้อนกลับทั้งชุดแล้ว คืนค่าเดิมทุกช่อง','Whole import undone; every field restored'))}break}
 case 'cfOld':row.keepOld=true;row.s=+row.old;row.st='dup';row.skip=true;render();break;
 case 'cfNew':row.keepOld=false;render();break;
 case 'upSample':{const f=Array.from({length:12},(_,k)=>k<10?`IMG_${2040+k}.png`:k===10?'syllabus.pdf':'scores.csv');startUpload(f);break}
 case 'upRetry':{const b=S.uploads.batches[i];b.st='read';b.p=40;render();setTimeout(()=>{b.st='done';b.p=100;b.rows=9;S.uploads.done++;render()},900);break}
 case 'upCancel':S.uploads=null;render();break;
 case 'upReview':S.review={title:'Experiential English I · 12 '+L('ไฟล์','files'),src:'img',rows:mkReview('img')};go('review');break;
 case 'gpaSet':S.gpaSim[el.dataset.c]=v;render();break;
 case 'gpaReset':S.gpaSim={c1:'A',c2:'A',c3:'B+',c4:'B',c5:'B',c6:'A'};render();break;
 case 'planDel':S.plan[el.dataset.t]=S.plan[el.dataset.t].filter(c=>c!==el.dataset.c);render();break;
 case 'planAdd':S.planTarget=el.dataset.t;go('catalog');toast(L('เลือก + จากรายการเพื่อเพิ่มเข้าแผน','Tap + to add to the plan'));break;
 case 'catRange':S.catRange=!S.catRange;S.catPage=0;if(S.route!=='catalog')go('catalog');else render();break;
 case 'catPg':S.catPage+=+v;render();break;
 case 'catAdd':{const t=S.planTarget||'2/2569';if(!S.plan[t].includes(el.dataset.c))S.plan[t].push(el.dataset.c);toast(L(`เพิ่ม ${el.dataset.c} ในแผน ${t}`,`Added ${el.dataset.c} to ${t}`));break}
 case 'profPick':S.profile[el.dataset.k]=v;render();break;
 case 'profNext':S.profileStep++;render();break;
 case 'profBack':S.profileStep--;render();break;
 case 'profReset':S.profileStep=0;render();break;
 case 'applySuggested':S.theme=S.profile.inst==='tu'?'tu':S.profile.fac==='cbs'?'cbs':S.profile.inst==='cu'?'cu':'gs';S.accentCustom='';render();toast(L('เปลี่ยนธีมแล้ว · ข้อมูลวิชาไม่เปลี่ยน','Theme changed · course data untouched'));break;
 case 'theme':S.theme=v;S.accentCustom='';render();break;
 case 'mode':S.mode=v;render();break;
 case 'reset':S.theme='gs';S.mode='system';S.accentCustom='';render();break;
 case 'admPub':S.admin[i][2]='เผยแพร่แล้ว';render();toast(L('เผยแพร่ batch แล้ว · ย้อนได้','Batch published · reversible'));break;
 case 'admDiff':sheet(`<div class="grab"></div><h2 style="font-size:18px;margin:0 0 8px">Diff</h2><table class="t small"><tr><th>code</th><th>field</th><th>${L('เดิม','old')}</th><th>${L('ใหม่','new')}</th></tr><tr><td class="code">AC296</td><td>credits</td><td>—</td><td class="n">1.5</td></tr><tr><td class="code">FN281</td><td>title_en</td><td>—</td><td>Wealth Management</td></tr></table>`);break;
 case 'conn':if(v==='json'){S.review={title:L('วาง JSON จาก AI อื่น','Pasted JSON from another AI'),src:'json',rows:mkReview('voice')};go('review');break}S.conns[v]=!S.conns[v];render();toast(S.conns[v]?L('จำลองการเชื่อมต่อ (OAuth จริงรอระบบยืนยันตัวตน)','Simulated connection (real OAuth waits for secure sign-in)'):L('ยกเลิกสิทธิ์แล้ว · AI นี้อ่านหรือเขียนข้อมูลไม่ได้อีก','Revoked · this AI can no longer read or write'));break;
 case 'connConfirm':{const h={id:'h'+Date.now(),when:L('เมื่อสักครู่','just now'),src:'chatgpt',n:9,course:'Experiential English I · ChatGPT',undone:false};S.history.unshift(h);S.lastH=h.id;toast(L('บันทึก 9 รายการผ่าน ChatGPT','Saved 9 items via ChatGPT'),'undoLast');break}
 case 'toast':toast(v==='fb'?L('ส่งแล้ว ขอบคุณครับ','Sent, thank you'):v==='goal'?L('แก้เป้าหมาย (ต้นแบบ)','Edit target (prototype)'):v==='ics'?L('สร้างไฟล์ .ics (ในแอปจริงจะดาวน์โหลด)','.ics created (downloads in the real app)'):L('ย้อน batch แล้ว','Batch rolled back'));break;
 }
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.ed&&S.review){const r=S.review.rows.find(x=>x.id===+t.dataset.i);const k=t.dataset.ed;let v=t.value.trim();if(k==='s'||k==='m'){v=v===''?(k==='s'?null:''):+v}r[k]=v;
  if((k==='s'||k==='m')&&r.s!=null&&r.m!==''&&!isNaN(r.m)){r.st=r.s>r.m?'bad':(r.old?'upd':'new')}else if(k==='m'&&v==='')r.st='chk'}
 if(t.id==='cmdIn'){S.cmdQ=t.value;const p=t.selectionStart;$('#layer').innerHTML=cmdMenu();const n=$('#cmdIn');n.focus();n.setSelectionRange(p,p)}
 if(t.id==='catQ'){S.catQ=t.value;S.catPage=0;const p=t.selectionStart;render();const n=$('#catQ');n.focus();n.setSelectionRange(p,p)}
 if(t.id==='accIn'){S.accentCustom=t.value;applyRoot();const cr=$('#cr');if(cr)cr.textContent=contrast()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.ed==='c'&&S.review){S.review.rows.find(x=>x.id===+t.dataset.i).c=t.value}
 if(t.dataset.act==='catInst'){S.catInst=t.value;S.catPage=0;render()}
 if(t.dataset.act==='catStatus'){S.catStatus=t.value;S.catPage=0;render()}
 if(t.id==='pTheme'){S.theme=t.value;S.accentCustom='';render()}if(t.id==='pMode'){S.mode=t.value;render()}if(t.id==='pLang'){S.lang=t.value;render()}if(t.id==='pFont'){S.font=t.value;render()}
 if(t.dataset.ed==='s'||t.dataset.ed==='m')render();
 if(t.id==='fileIn'&&t.files.length){const names=[...t.files].map(f=>f.name);const audio=[...t.files].some(f=>f.type.startsWith('audio'));S.aiStarted=true;pushChat({k:'u',text:audio?L('ไฟล์เสียงแนบมา','Attached audio'):L('แนบไฟล์','Attached files'),files:names});if(audio){const tr={k:'transcribing'};pushChat(tr);setTimeout(()=>{S.chat=S.chat.filter(m=>m!==tr);pushChat({k:'transcript',text:SAMPLE_SPEECH})},1200)}else setTimeout(()=>pushChat({k:'a',text:L(`ได้รับ ${names.length} ไฟล์ · ในแอปจริงจะเข้าคิวอ่านและสร้างรายการให้ตรวจ`,`Got ${names.length} files · the real app queues them and builds a review list`)}),500)}
 if(t.id==='upIn'&&t.files.length)startUpload([...t.files].map(f=>f.name))});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.cmdQ='';$('#layer').innerHTML=cmdMenu();$('#cmdIn').focus();return}if(e.key==='Enter'&&e.target.id==='cmdIn'){const b=document.querySelector('[data-act=cmdRun]');if(b)b.click();return}if(e.key==='Enter'&&e.target.matches('.card[data-course]'))e.target.click();if(e.key==='Escape'){$('#layer').innerHTML='';if(S.aiOpen){S.aiOpen=false;render()}}if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cin'){e.preventDefault();document.querySelector('[data-act=send]').click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.voice.st==='rec'){S.voice.st='paused';render()}});
function startUpload(files){const B=[];for(let k=0;k<files.length;k+=5)B.push({files:files.slice(k,k+5),st:'up',p:0,rows:0});S.uploads={batches:B,done:0};render();
 B.forEach((b,k)=>{let p=0;const t=setInterval(()=>{p+=20;b.p=Math.min(p,100);b.st=p<50?'up':'read';if(k===1&&p>=60){clearInterval(t);b.st='fail';render();return}if(p>=100){clearInterval(t);b.st='done';b.rows=b.files.length*3;S.uploads&&S.uploads.done++}if(S.route==='upload')render()},300+k*120)})}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='ai'){S.aiOpen=true;render();return}if(ROUTES.includes(h)&&h!==S.route){S.route=h;render()}});
{const h=location.hash.slice(1);if(h==='ai')S.aiOpen=true;else if(ROUTES.includes(h))S.route=h}
$('#pfab').addEventListener('click',()=>{const p=$('#ppanel');p.hidden=!p.hidden;$('#pfab').setAttribute('aria-expanded',String(!p.hidden))});
render();
}
